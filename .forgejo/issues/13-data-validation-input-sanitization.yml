    - Max 500 block patterns (`MAX_BLOCK_PATTERNS`)
    - Max 128 characters per target name (`MAX_SERVER_NAME_LENGTH`)
    - Max 10000 characters per regex pattern (`MAX_REGEX_PATTERN_LENGTH`)
    - Reference constants from `lib/constants.py` (see Topic 14)
    - Raise `ConfigValidationError` with a clear message referencing the offending field
    - Add tests for each limit boundary

    **Acceptance criteria** (from topic plan):
    - Config resource limits enforced
  labels:
    - "area/validation"
