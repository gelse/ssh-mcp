    - "priority/normal"
  assignees: []

- title: "Add ReDoS protection for block pattern regex"
  description: |
    Detect and reject dangerous regex patterns at config load time to prevent
    catastrophic backtracking (ReDoS) attacks.

    **Context**: Topic 13, Issue #7 "Regex Injection in Block Patterns". Subtask 13a,
    Implementation Step 6.
    See [`plans/13-data-validation-input-sanitization.md`](plans/13-data-validation-input-sanitization.md:64)
    and [`plans/13a-input-validation-sanitization-pipeline.md`](plans/13a-input-validation-sanitization-pipeline.md:20).

    **Current state**: Block patterns are user-provided regex compiled and matched
    without any complexity guard; a pattern like `(a+)+b` against crafted input causes
    exponential backtracking.

    **Tasks**:
    - Test patterns on init with a timeout (e.g. `signal.alarm` or a threading timer)
    - Flag patterns matching known dangerous constructs: `(a+)+`, `(a|a)+`, `(.*a){n}`
    - Prefer `re.compile(pattern, re.LIMITED_TIME)` where the Python version supports it,
      or add a timeout wrapper around regex matching
    - Reject unsafe patterns at config load with a clear error
    - Add tests with known ReDoS patterns verifying rejection and safe behavior

    **Acceptance criteria** (from subtask 13a):
    - Dangerous regex patterns flagged at config load
    - Regex matching bounded by a timeout wrapper
  labels:
    - "area/validation"
    - "area/security"
    - "priority/high"
  assignees: []

- title: "Harden SFTP path validation with realpath and sandbox checks"
  description: |
    Strengthen SFTP path validation: reject null bytes, normalize with `normpath()`,
    resolve symlinks with `realpath()`, enforce a sandbox root, and limit path length.

    **Context**: Topic 13, Issue #5 "Path Validation — Incomplete". Improvement #5
    "Path Validation Hardening". See
    [`plans/13-data-validation-input-sanitization.md`](plans/13-data-validation-input-sanitization.md:49)
    and the pipeline at [`plans/13-data-validation-input-sanitization.md`](plans/13-data-validation-input-sanitization.md:102).

    **Current state**: SFTP path checks in [`server.py:252`](server.py:252) and
    [`server.py:298`](server.py:298) use `os.path.isabs()` and `os.pardir` only — they
    miss null bytes, symlink traversal, path length, and have no sandbox root.

    **Tasks**:
    - Reject paths containing null bytes (`\x00`)
    - Normalize with `os.path.normpath()` and reject `..` traversal
    - Resolve symlinks with `os.path.realpath()` and check the result stays within the
      configured sandbox root
    - Limit path length
    - Document the strategy (see Topic 15b: realpath cannot be used pre-connection for
      uploads where the file may not exist yet)
    - Add tests for traversal, symlink escape, null bytes, and over-long paths

    **Acceptance criteria** (from topic plan):
    - SFTP paths validated with `realpath()` and sandbox check
  labels:
    - "area/validation"
    - "area/security"
    - "priority/high"
  assignees: []

