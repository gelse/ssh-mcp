    See [`plans/13-data-validation-input-sanitization.md`](plans/13-data-validation-input-sanitization.md:57)
    and [`plans/13a-input-validation-sanitization-pipeline.md`](plans/13a-input-validation-sanitization-pipeline.md:17).

    **Current state**: [`lib/config.py`](lib/config.py:1) validates types and required
    fields but places no bounds on counts or lengths.

    **Tasks**:
