- title: "Simplify SSH key loading with a dispatch table"
  description: |
    Replace the nested `if/elif` PEM-header detection in `_get_ssh_client()` with a
    dispatch table and a `_load_ssh_key()` helper.

    **Context**: Topic 14, Readability Issue #1 "Dense Conditional Logic" and Improvement
    #5 "Simplify Key Loading". Subtask 14b, Implementation Step 1.
    See [`plans/14-naming-conventions-readability.md`](plans/14-naming-conventions-readability.md:101)
    and [`plans/14b-simplify-key-loading-editorconfig-test-names.md`](plans/14b-simplify-key-loading-editorconfig-test-names.md:17).

    **Current state**: Key type detection in [`server.py:152`](server.py:152) uses nested
    `if/elif` checking PEM headers with string inspection.

    **Tasks**:
    - Introduce `_KEY_LOADERS` dispatch table mapping PEM headers to paramiko key loaders:
      - `BEGIN OPENSSH PRIVATE KEY` → `Ed25519Key` (ssh-keygen -t ed25519)
      - `BEGIN RSA PRIVATE KEY` → `RSAKey` (legacy PKCS#1)
      - `BEGIN PRIVATE KEY` → `Ed25519Key` (generic PKCS#8)
    - Add `_load_ssh_key(key_path)` helper raising `SSHError` on unsupported formats
    - Add comments explaining each key format (see Topic 15b for full rationale)
    - Works on the renamed `_get_ssh_client()` from subtask 14a

    **Acceptance criteria** (from subtask 14b):
    - Key loading uses dispatch table, not nested if/elif
  labels:
    - "area/readability"
    - "area/ssh"
    - "priority/normal"
  assignees: []

