- title: "Rename internal helpers in server.py to use underscore prefix"
  description: |
    Make module-internal helpers private by adding the `_` prefix.

    **Context**: Topic 14, Issue #1 "Inconsistent Private/Public Boundary". Subtask 14a,
    Implementation Step 1.
    See [`plans/14-naming-conventions-readability.md`](plans/14-naming-conventions-readability.md:65)
    and [`plans/14a-rename-internals-constants-docstrings.md`](plans/14a-rename-internals-constants-docstrings.md:16).

    **Current state**: `get_ssh_client()`, `get_api_key()`, and `ensure_directories()` in
    [`server.py`](server.py:1) are module-internal helpers but lack the `_` prefix,
    implying they are public API when they are not.

    **Tasks**:
    - `get_ssh_client()` → `_get_ssh_client()`
    - `get_api_key()` → `_get_api_key()`
    - `ensure_directories()` → `_ensure_directories()`
    - Update all call sites within `server.py`
    - Rename `_check_block_patterns()` in `server.py` → `_build_block_pattern_error()` to
      differentiate it from `AuthorizationManager._check_block_patterns()`
    - Update all test references to the renamed functions

    **Acceptance criteria** (from subtask 14a):
    - All internal helpers in `server.py` have the `_` prefix
    - All existing tests pass with renamed symbols
  labels:
    - "area/readability"
    - "priority/normal"
  assignees: []

- title: "Standardize target identifier name to target_name"
  description: |
    Use `target_name` consistently in all internal code (function parameters, AuthResult
    field, log events) while keeping `server_name` only in MCP tool signatures.

    **Context**: Topic 14, Issue #4 "Variable Name Inconsistency". Subtask 14a,
    Implementation Step 2.
    See [`plans/14-naming-conventions-readability.md`](plans/14-naming-conventions-readability.md:76)
    and [`plans/14a-rename-internals-constants-docstrings.md`](plans/14a-rename-internals-constants-docstrings.md:23).

    **Current state**: `server_name` (tool signatures), `target_name` (config), and
    `name` (AuthResult dataclass) all refer to the same concept (SSH target identifier).

    **Tasks**:
    - All internal code uses `target_name` (function parameters, `AuthResult` field, log events)
    - Keep `server_name` only in MCP tool function signatures (API contract for external clients)
    - In tool bodies, immediately assign `target_name = server_name`
    - Update `AuthResult` dataclass: `name` → `target_name`
    - Update all references in [`lib/auth.py`](lib/auth.py:1), [`lib/config.py`](lib/config.py:1),
      log events, and error messages
    - Standardize test fixtures from `server_name` → `target_name`

    **Acceptance criteria** (from subtask 14a):
    - `target_name` used consistently in all internal code
    - `server_name` appears only in MCP tool signatures
    - `AuthResult.name` renamed to `AuthResult.target_name`
  labels:
    - "area/readability"
    - "priority/normal"
  assignees: []

- title: "Create lib/constants.py with all magic values and defaults"
  description: |
    Create `lib/constants.py` defining every magic number and string scattered across the
    codebase, and replace the raw values with imports.

    **Context**: Topic 14, Issue #5 "Magic Number Naming" and Improvement #3 "Define All
    Constants". Subtask 14a, Implementation Steps 3 and 4.
    See [`plans/14-naming-conventions-readability.md`](plans/14-naming-conventions-readability.md:82)
    and [`plans/14a-rename-internals-constants-docstrings.md`](plans/14a-rename-internals-constants-docstrings.md:30).

    **Current state**: Magic numbers (`15` watcher interval, `50kb` max output, `10` max
    log size MB, `5` backup count) and magic strings (`"mcp-ssh"`, `"sha256:"`, `"sudo"`,
    `"127.0.0.1"`, `"ssh_key"`, `"config.json"`, `"/logs"`) are scattered across files.

    **Tasks**:
    - Create `lib/constants.py` with:
      - App identity: `APP_NAME`, `APP_VERSION`
      - Default paths: `DEFAULT_CONFIG_FILENAME`, `DEFAULT_LOG_DIR`, `DEFAULT_LOG_FILENAME`,
        `DEFAULT_SSH_KEY_FILENAME`
      - Auth constants: `API_KEY_HASH_PREFIX`, `SUDO_COMMAND_PREFIX`,
        `SUDO_PASSWORD_PROMPT_FLAGS`, `SUDO_NO_PASSWORD_FLAG`, `FALLBACK_CLIENT_IP`
      - Default settings: `DEFAULT_MAX_COMMAND_OUTPUT`, `DEFAULT_COMMAND_TIMEOUT_SECONDS`,
        `DEFAULT_MAX_LOG_FILE_SIZE_MB`, `DEFAULT_MAX_LOG_BACKUP_COUNT`,
        `DEFAULT_WATCHER_INTERVAL_SECONDS`
      - Limits: `MAX_SERVER_NAME_LENGTH`, `MAX_API_KEY_LENGTH`, `MAX_REGEX_PATTERN_LENGTH`,
        `MAX_TARGETS`, `MAX_BLOCK_PATTERNS`
      - SSH defaults: `DEFAULT_SSH_PORT`, `DEFAULT_SSH_TIMEOUT_SECONDS`
      - HTTP: `HTTP_TOO_MANY_REQUESTS`, `HTTP_SERVICE_UNAVAILABLE`
    - Replace magic values in [`server.py`](server.py:1), [`lib/auth.py`](lib/auth.py:1),
      [`lib/config.py`](lib/config.py:1) with imports
    - Rename `_current_log_path` → `_log_path` in [`lib/loggers.py`](lib/loggers.py:1)

    **Acceptance criteria** (from subtask 14a):
    - `lib/constants.py` defines all magic values and is imported wherever they're used
    - `_current_log_path` renamed to `_log_path`
  labels:
    - "area/readability"
    - "priority/normal"
  assignees: []

