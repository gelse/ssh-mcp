    "Consistent Tool Naming Convention (Document, Don't Change)".
    See [`plans/14-naming-conventions-readability.md`](plans/14-naming-conventions-readability.md:72)
    and [`plans/14-naming-conventions-readability.md`](plans/14-naming-conventions-readability.md:143).

    **Current state**: `ssh_` prefix is redundant across tools but removing it would break
    the MCP API; the naming convention is undocumented.

    **Tasks**:
