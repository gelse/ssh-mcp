- title: "Replace overly explicit boolean checks with idiomatic style"
  description: |
    Replace `len(x) > 0` style checks with implicit truthiness and clean up residual
    commented-out code / debug prints.

    **Context**: Topic 14, Readability Issue #3 "Implicit Boolean Checks" and Issue #4
    "Commented-Out Code". Subtask 14b, Implementation Step 5.
    See [`plans/14-naming-conventions-readability.md`](plans/14-naming-conventions-readability.md:115)
    and [`plans/14b-simplify-key-loading-editorconfig-test-names.md`](plans/14b-simplify-key-loading-editorconfig-test-names.md:124).

    **Current state**: Code uses overly explicit checks such as `if len(key) > 0:`,
    `if len(patterns) == 0:`, and `if result is not None and len(result) > 0:`.

    **Tasks**:
    - `if len(key) > 0:` → `if key:`
    - `if len(patterns) == 0:` → `if not patterns:`
    - `if result is not None and len(result) > 0:` → `if result:`
    - Audit for and remove any residual commented-out code or debug prints
    - Add tests confirming behavior is unchanged after refactor

    **Acceptance criteria** (from subtask 14b):
    - No overly explicit boolean checks (e.g. `len(x) > 0`)
  labels:
    - "area/readability"
    - "priority/low"
  assignees: []

