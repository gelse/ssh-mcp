- title: "Create ARCHITECTURE.md with diagrams, data flow, and design rationale"
  description: |
    Create `ARCHITECTURE.md` documenting high-level architecture, component relationships,
    data flow, authorization decision tree, config hot-reload, and thread safety.

    **Context**: Topic 15, Issue #3 "No Architecture Documentation". Subtask 15a,
    Implementation Step 2.
    See [`plans/15-documentation-inline-comments.md`](plans/15-documentation-inline-comments.md:44)
    and [`plans/15a-readme-architecture-security-contributing.md`](plans/15a-readme-architecture-security-contributing.md:87).

    **Current state**: No document explains the architecture, data flow from MCP request
    to SSH execution, the authorization chain, config hot-reload, or Docker deployment.

    **Tasks**:
    - Component diagram (Mermaid) showing Client → Traefik → FastMCP → RequestContext →
      tools → AuthorizationManager / SSHClientManager / FileTransferService → targets,
      plus ConfigManager and FileLogger
    - Authorization decision tree (Mermaid flowchart): sanitize → block patterns → default
      allowlist → API key rules → network rules → deny
    - Data flow: MCP JSON-RPC request → middleware extracts IP/API key → tool handler →
      auth check → SSH connection → execution → response
    - Config hot-reload mechanism: watcher polls mtime → validates → atomic swap →
      notifies auth manager
    - Thread safety design: `threading.Lock` for writes, atomic reference swap for reads,
      FileLogger serialization
    - File organization rationale for the `lib/` modules

    **Acceptance criteria** (from subtask 15a):
    - `ARCHITECTURE.md` with Mermaid component diagram, authorization flowchart, data flow,
      thread safety explanation
  labels:
    - "area/documentation"
    - "priority/normal"
  assignees: []

- title: "Create SECURITY.md with security model and TLS requirements"
  description: |
    Create `SECURITY.md` documenting the security model, trust boundaries, TLS
    requirement, API key and SSH key management, vulnerability reporting, and
    security-relevant configuration.

    **Context**: Topic 15, Documentation Plan #5 "Create SECURITY.md". Subtask 15a,
    Implementation Step 3.
    See [`plans/15-documentation-inline-comments.md`](plans/15-documentation-inline-comments.md:132)
    and [`plans/15a-readme-architecture-security-contributing.md`](plans/15a-readme-architecture-security-contributing.md:141).

    **Current state**: A `docs/SECURITY.md` exists but the plan calls for a top-level
    security policy; the security model, TLS requirement, and reporting process are not
    documented at the repository root.

    **Tasks**:
    - Security model: bridge between MCP clients and SSH servers behind a TLS-terminating
      reverse proxy (Traefik by default)
    - Trust boundaries: external → MCP server (API key), MCP server → SSH target (key/password),
      config file (mode 0600)
    - TLS requirement: MUST be deployed behind TLS; never expose FastMCP directly
    - API key management: SHA-256 hashes (`sha256:` prefix), ≥128-bit entropy, rotation,
      per-client least-privilege keys
    - SSH key security: Ed25519 preferred, mode 0600, agent forwarding option, dedicated keys
    - Vulnerability reporting process (email/issue policy/PGP placeholder)
    - Security-relevant config options: `block_patterns`, `max_command_output`,
      `command_timeout_seconds`, `sudo_allowed`

    **Acceptance criteria** (from subtask 15a):
    - `SECURITY.md` with trust boundaries, TLS requirement, API key guidance, vulnerability reporting
  labels:
    - "area/documentation"
    - "area/security"
    - "priority/normal"
  assignees: []

