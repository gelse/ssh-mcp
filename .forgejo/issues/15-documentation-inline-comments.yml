- title: "Add inline comments for complex logic (auth chain, segmentation, key loading)"
  description: |
    Add explanatory inline comments for the authorization chain, command segmentation
    regex, key loading PEM headers, IP extraction trust model, sudo wrapping, and SFTP
    path validation.

    **Context**: Topic 15, Issue #4 "Complex Logic Without Comments". Subtask 15b,
    Implementation Step 2.
    See [`plans/15-documentation-inline-comments.md`](plans/15-documentation-inline-comments.md:52)
    and [`plans/15b-docstrings-inline-comments.md`](plans/15b-docstrings-inline-comments.md:158).

    **Current state**: PEM header inspection, the `|&;` segmentation regex, X-Forwarded-For
    parsing, sudo flag wrapping, and SFTP path handling have no explanatory comments.

    **Tasks**:
    - Authorization chain in `lib/auth.py:check_command()`: comment each layer (block
      patterns → default allowlist → API key rules → network rules → implicit deny)
    - Command segmentation: comment `_SEGMENT_SPLIT_RE = re.compile(r'[|&;]')` explaining
      it prevents `allowed_cmd | dangerous_cmd` from passing auth
    - Key loading: comment PEM header meanings (OPENSSH = Ed25519, RSA PKCS#1, PKCS#8) and
      why the header is checked instead of the file extension
    - IP extraction: document X-Forwarded-For format, leftmost-IP rule, spoofing risk
      without trusted proxy, X-Real-IP fallback
    - Sudo wrapping: explain `sudo -S -p ''` (password from stdin, empty prompt) and
      `sudo -n` (non-interactive), and the password vs NOPASSWD strategy
    - SFTP path validation: document isabs, pardir, null-byte checks and why realpath is
      not used pre-connection for uploads

    **Acceptance criteria** (from subtask 15b):
    - Authorization chain, segmentation regex, key dispatch table, IP trust model, sudo
      flags, and SFTP path strategy all have explanatory comments
  labels:
    - "area/documentation"
    - "priority/normal"
  assignees: []

