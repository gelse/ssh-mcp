      div.appendChild(keyGroup);

      return div;
    }, async (body) => {
      const name = body.querySelector('#m-key-name').value.trim();
      const plaintext = body.querySelector('#m-key-plaintext').value.trim();
      if (!name) throw new Error('Name is required');
      if (!plaintext) throw new Error('Key is required');
      // Hash the key
      const hashRes = await api('POST', '/hash-key', { key: plaintext });
      if (!hashRes.ok) {
        const err = await hashRes.json();
        throw new Error(err.message || 'Failed to hash key');
      }
      const hashData = await hashRes.json();
      const keyHash = hashData.key_hash;
      // Add to api_keys
      const newKey = { name, key_hash: keyHash, rules: [] };
      const updatedKeys = [...apiKeys, newKey];
      const r = await api('PUT', '/config/allowed_commands', { api_keys: updatedKeys });
      if (!r.ok) {
        const err = await r.json();
        throw new Error(err.message || 'Failed to save');
      }
      // Show the plaintext key once
      showModal('Key Created (save this now)', () => {
        const div = el('div', 'space-y-3');
        const infoP = el('p', 'text-sm text-gray-700');
        infoP.textContent = 'Your API key has been created. Copy it now — it will not be shown again.';
        div.appendChild(infoP);
        const keyDiv = el('div', 'bg-gray-100 p-3 rounded font-mono text-sm break-all');
        keyDiv.id = 'm-created-key';
        keyDiv.textContent = plaintext;
        div.appendChild(keyDiv);
        const copyBtn = el('button', 'text-blue-600 hover:text-blue-800 text-sm');
        copyBtn.id = 'm-copy-btn';
        copyBtn.textContent = 'Copy to clipboard';
        div.appendChild(copyBtn);
        return div;
      }, async () => {
        // Just close the modal
      }, (body) => {
        const copyBtn = body.querySelector('#m-copy-btn');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            if (!navigator.clipboard) { showToast('Clipboard unavailable', 'error'); return; }
            navigator.clipboard.writeText(plaintext)
              .then(() => showToast('Copied to clipboard'))
              .catch(() => showToast('Failed to copy', 'error'));
          });
        }
      });
      showToast('API key created');
      renderRules();
    }, (body) => {
      const input = body.querySelector('#m-key-plaintext');
      const toggle = body.querySelector('#m-key-toggle');
      const eyeOpen = body.querySelector('#m-key-eye-open');
      const eyeClosed = body.querySelector('#m-key-eye-closed');
      if (toggle && input && eyeOpen && eyeClosed) {
        toggle.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          eyeOpen.classList.toggle('hidden', !isPassword);
          eyeClosed.classList.toggle('hidden', isPassword);
          toggle.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
          toggle.setAttribute('aria-label', isPassword ? 'Hide API key' : 'Show API key');
        });
      }
    });
  });
}

// ===========================================================================
// Commands Editor (Network Rules)
// ===========================================================================

/** Wildcard marker for sudo_allowed meaning "every command in the rule". */
const SUDO_ALLOWED_WILDCARD = '*';

/**
 * Render the read-only Commands cell: comma-joined commands with the
 * sudo-allowed ones in bold.
 *
 * @param {HTMLTableCellElement} cell - the Commands cell to fill
 * @param {string[]} commands - stored command list
 * @param {string[]} sudoAllowed - stored sudo_allowed list ('*' = all)
 * @returns {void}
 */
function renderCommandsCell(cell, commands, sudoAllowed) {
  const list = Array.isArray(commands) ? commands : [];
  const flags = Array.isArray(sudoAllowed) ? sudoAllowed : [];
  const sudoAll = flags.includes(SUDO_ALLOWED_WILDCARD);
  const sudoSet = new Set(flags);

  cell.textContent = '';
  if (list.length === 0) {
    cell.textContent = '(none)';
    return;
  }
  list.forEach((command, i) => {
    if (i > 0) cell.appendChild(document.createTextNode(', '));
    if (sudoAll || sudoSet.has(command)) {
      const strong = document.createElement('strong');
      strong.className = 'font-bold';
      strong.textContent = command;
      cell.appendChild(strong);
    } else {
      cell.appendChild(document.createTextNode(command));
    }
  });
}

/**
 * Expand a stored sudo_allowed list into one flag per command.
 *
 * @param {string[]} commands - stored command list
 * @param {string[]} sudoAllowed - stored sudo_allowed list ('*' = all)
 * @returns {boolean[]} per-command sudo flags, aligned with `commands`
 */
function sudoFlagsFor(commands, sudoAllowed) {
  const list = Array.isArray(commands) ? commands : [];
  const stored = Array.isArray(sudoAllowed) ? sudoAllowed : [];
  if (stored.includes(SUDO_ALLOWED_WILDCARD)) return list.map(() => true);
  const sudoSet = new Set(stored);
  return list.map((command) => sudoSet.has(command));
}

/**
 * Serialize per-command sudo flags back to a sudo_allowed list: every command
 * checked collapses to the '*' wildcard, otherwise the explicit list is
 * written (an empty list when nothing is checked).
 *
 * @param {string[]} commands - command list being saved
 * @param {boolean[]} flags - per-command sudo flags
 * @returns {string[]} the sudo_allowed value to store
 */
function serializeSudoAllowed(commands, flags) {
  const checked = commands.filter((_, i) => flags[i]);
  if (commands.length > 0 && checked.length === commands.length) {
    return [SUDO_ALLOWED_WILDCARD];
  }
  return checked;
}

/**
 * Compare two lists element-wise.
 *
 * @param {Array} a - first list
 * @param {Array} b - second list
 * @returns {boolean} true when both lists hold the same values in the same
 *   order (non-arrays are treated as empty lists)
 */
function sameList(a, b) {
  const left = Array.isArray(a) ? a : [];
  const right = Array.isArray(b) ? b : [];
  return left.length === right.length && left.every((value, i) => value === right[i]);
}

/**
 * Read the server error message from a failed response.
 *
 * @param {Response} res - failed response
 * @param {string} fallback - message to use when the body has none
 * @returns {Promise<string>} the message to display
 */
async function responseErrorMessage(res, fallback) {
  try {
    const err = await res.json();
    return err.message || fallback;
  } catch (e) {
    return fallback;
  }
}

// Editor writes are applied strictly in the order the user made them: each
// payload is built right before its PUT goes out, so it reflects every edit
// committed while earlier requests were still in flight, and a slow earlier
// request can never overwrite a newer one.
let pendingCommandsPuts = Promise.resolve();

/**
 * Queue one allowed_commands PUT behind all editor PUTs already in flight.
 *
 * @param {Function} buildNetworks - called at send time; returns the payload's
 *   networks array (freshly derived from the current in-memory state)
 * @returns {Promise<Response>} resolves with the PUT response once sent
 */
function enqueueCommandsPut(buildNetworks) {
  const run = pendingCommandsPuts.then(() =>
    api('PUT', '/config/allowed_commands', { networks: buildNetworks() })
  );
  // Keep the chain alive after a rejected PUT so later edits still send.
  pendingCommandsPuts = run.catch(() => {});
  return run;
}

/**
 * Open the modal commands editor for one Network Rules target configuration.
 *
 * The modal shows a table with one row per command: the command text and a
 * sudo checkbox. A trailing empty row adds new commands; Enter moves to the
 * next row or appends a new one, Ctrl/Cmd+Enter saves, Escape cancels.
 * Losing focus never saves or cancels. Only this entry's `commands` and
 * `sudo_allowed` are ever written; every other value in the payload is
 * preserved by spreading the untouched objects.
 *
 * @param {HTMLTableCellElement} cell - the Commands cell that opened the modal
 * @param {Object} entry - the rule entry being edited
 * @param {number} entryIdx - index of that entry inside its network's rules
 * @param {Object} ctx - rendering context captured by the caller
 * @param {Object[]} ctx.networks - full in-memory networks array
 * @param {number} ctx.netIdx - index of the entry's network in `networks`
 * @param {Object[]} ctx.rules - the network's rules array
 * @returns {void}
 */
function openCommandsModal(cell, entry, entryIdx, ctx) {
  if (!entry || typeof entry !== 'object') return;

  const container = document.getElementById('modal-container');

  // Overlay: deliberately inert on click — losing focus must never save,
  // cancel or close anything.
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay fixed inset-0 z-40 flex items-center justify-center';

  const card = document.createElement('div');
  card.className = 'bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 max-h-[90vh] flex flex-col';
  overlay.appendChild(card);

  // Header: title plus Save / Delete / Cancel on the right
  const header = document.createElement('div');
  header.className = 'flex items-center justify-between gap-4 px-6 py-4 border-b';

  const h3 = document.createElement('h3');
  h3.className = 'text-lg font-semibold truncate flex-1 min-w-0';
  const targetList = Array.isArray(entry.targets) ? entry.targets : [];
  h3.textContent = `Commands for ${targetList.join(', ') || '(none)'}`;

  const actions = document.createElement('div');
  actions.className = 'flex items-center gap-2 flex-shrink-0';

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.id = 'm-cmd-save';
  saveBtn.className = 'px-3 py-1.5 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm';
  saveBtn.textContent = 'Save';

  const deleteBtn = document.createElement('button');
  deleteBtn.type = 'button';
  deleteBtn.id = 'm-cmd-delete';
  deleteBtn.className = 'px-3 py-1.5 bg-red-600 text-white rounded hover:bg-red-700 text-sm';
  deleteBtn.textContent = 'Delete';

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.id = 'm-cmd-cancel';
  cancelBtn.className = 'px-3 py-1.5 text-gray-700 bg-gray-200 rounded hover:bg-gray-300 text-sm';
  cancelBtn.textContent = 'Cancel';

  actions.appendChild(saveBtn);
  actions.appendChild(deleteBtn);
  actions.appendChild(cancelBtn);
  header.appendChild(h3);
  header.appendChild(actions);
  card.appendChild(header);

  // Body: command table
  const body = document.createElement('div');
  body.className = 'px-6 py-4 overflow-y-auto flex-1';

  const table = document.createElement('table');
  table.id = 'm-cmd-table';
  table.className = 'min-w-full text-sm';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');

  // Command column header doubles as the sort control: a click cycles
  // ascending → descending → ascending. Only the display order changes here;
  // saves always write the alphabetical order.
  const commandTh = document.createElement('th');
  commandTh.className = 'text-left font-medium text-gray-600 pb-2 pr-2';
  commandTh.setAttribute('aria-sort', 'none');
  const sortBtn = document.createElement('button');
  sortBtn.type = 'button';
  sortBtn.id = 'm-cmd-sort';
  sortBtn.className = 'inline-flex items-center gap-1 font-medium text-gray-600 hover:text-gray-900';
  sortBtn.title = 'Sort by command';
  const sortLabel = document.createElement('span');
  sortLabel.textContent = 'Command';
  const sortArrow = document.createElement('span');
  sortArrow.className = 'text-xs leading-none';
  sortArrow.textContent = '\u2195';
  sortBtn.appendChild(sortLabel);
  sortBtn.appendChild(sortArrow);
  commandTh.appendChild(sortBtn);
  headRow.appendChild(commandTh);

  [
    { text: 'Sudo', className: 'text-center font-medium text-gray-600 pb-2 px-2 w-16' },
    { text: '', className: 'w-8' },
  ].forEach((spec) => {
    const th = document.createElement('th');
    th.className = spec.className;
    th.textContent = spec.text;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  body.appendChild(table);

  const errorP = document.createElement('p');
  errorP.id = 'm-cmd-error';
  errorP.className = 'text-red-600 text-sm mt-3 hidden';
  body.appendChild(errorP);
  card.appendChild(body);

  container.appendChild(overlay);

  const rows = [];

  /** Show an inline error inside the modal, keeping the user's edits. */
  function showError(message) {
    errorP.textContent = message;
    errorP.classList.remove('hidden');
  }

  /** Clear the inline error area. */
  function clearError() {
    errorP.textContent = '';
    errorP.classList.add('hidden');
  }

  // True while a PUT is in flight; guards every entry point against a second
  // request for the same edit.
  let busy = false;

  /** Enable/disable the header buttons while a request is in flight. */
  function setBusy(next) {
    busy = next;
    [saveBtn, deleteBtn, cancelBtn].forEach((btn) => { btn.disabled = next; });
    saveBtn.classList.toggle('opacity-50', next);
    deleteBtn.classList.toggle('opacity-50', next);
    cancelBtn.classList.toggle('opacity-50', next);
  }

  /** Close the modal without saving anything. */
  function close() {
    overlay.remove();
  }

  /** Turn the trailing row into a normal row (it gained content). */
  function promoteTrailing(row) {
    row.trailing = false;
    row.removeBtn.disabled = false;
    row.removeBtn.parentElement.classList.remove('invisible');
  }

  /**
   * Append one row to the table.
   *
   * @param {string} command - initial command text
   * @param {boolean} sudo - initial sudo flag
   * @param {boolean} trailing - true for the empty "add command" row, which
   *   cannot be removed and whose remove button is hidden
   * @returns {Object} the row record
   */
  function addRow(command, sudo, trailing) {
    const tr = document.createElement('tr');

    const cmdTd = document.createElement('td');
    cmdTd.className = 'py-1 pr-2';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = command || '';
    input.className = 'w-full px-2 py-1 border border-gray-300 rounded text-sm font-mono';
    input.setAttribute('aria-label', 'Command');
    cmdTd.appendChild(input);

    const sudoTd = document.createElement('td');
    sudoTd.className = 'py-1 px-2 text-center';
    const sudoBox = document.createElement('input');
    sudoBox.type = 'checkbox';
    sudoBox.checked = !!sudo;
    sudoBox.className = 'h-4 w-4';
    sudoBox.setAttribute('aria-label', 'Allow sudo');
    sudoTd.appendChild(sudoBox);

    const removeTd = document.createElement('td');
    removeTd.className = 'py-1 text-right';
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.textContent = '\u00d7';
    removeBtn.title = 'Remove command';
    removeBtn.setAttribute('aria-label', 'Remove command');
    removeBtn.className = 'text-gray-400 hover:text-red-600 text-lg leading-none px-1';
    removeTd.appendChild(removeBtn);

    tr.appendChild(cmdTd);
    tr.appendChild(sudoTd);
    tr.appendChild(removeTd);
    tbody.appendChild(tr);

    const row = { tr, input, sudo: sudoBox, removeBtn, trailing: !!trailing };
    if (trailing) {
      removeTd.classList.add('invisible');
      removeBtn.disabled = true;
    }
    rows.push(row);

    removeBtn.addEventListener('click', () => {
      if (row.trailing) return;
      const i = rows.indexOf(row);
      if (i >= 0) rows.splice(i, 1);
      tr.remove();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        moveToNextRow(row);
      }
    });

    return row;
  }

  /**
   * Enter-key navigation: focus the next command field, or append a fresh
   * empty row when already on the bottom row. An empty bottom row is a no-op
   * so repeated Enter presses cannot stack blank rows.
   *
   * @param {Object} row - the row whose input received Enter
   * @returns {void}
   */
  function moveToNextRow(row) {
    const i = rows.indexOf(row);
    if (i < 0) return;
    if (i < rows.length - 1) {
      rows[i + 1].input.focus();
      return;
    }
    if (!row.input.value.trim()) return;
    promoteTrailing(row);
    const next = addRow('', false, true);
    next.input.focus();
  }

  // Current display sort direction: null until the header is first clicked.
  let sortDirection = null;

  /**
   * Reorder the visible rows by command text, keeping each row's sudo flag
   * attached to its command. The trailing "add command" row always stays last
   * and is never sorted; this only affects the display, saves always write the
   * alphabetical order.
   *
   * @param {'asc'|'desc'} direction - sort order to apply
   * @returns {void}
   */
  function applySort(direction) {
    const trailing = rows[rows.length - 1];
    const sorted = rows.slice(0, -1).sort((a, b) => {
      const cmp = a.input.value.trim().localeCompare(b.input.value.trim());
      return direction === 'desc' ? -cmp : cmp;
    });
    sorted.forEach((row) => tbody.insertBefore(row.tr, trailing.tr));
    rows.length = 0;
    rows.push(...sorted, trailing);
    sortDirection = direction;
    sortArrow.textContent = direction === 'asc' ? '\u2191' : '\u2193';
    commandTh.setAttribute('aria-sort', direction === 'asc' ? 'ascending' : 'descending');
  }

  sortBtn.addEventListener('click', () => {
    applySort(sortDirection === 'asc' ? 'desc' : 'asc');
  });

  /**
   * Read the table into command and sudo-flag lists. Blank rows are dropped;
   * order and duplicates are preserved.
   *
   * @returns {{commands: string[], flags: boolean[]}} the parsed table
   */
  function readRows() {
    const commands = [];
    const flags = [];
    rows.forEach((row) => {
      const value = row.input.value.trim();
      if (!value) return;
      commands.push(value);
      flags.push(row.sudo.checked);
    });
    return { commands, flags };
  }

  /** Save the table (header Save button, Ctrl/Cmd+Enter). */
  async function doSave() {
    if (busy) return;
    clearError();
    const typed = readRows();

    // Saves always write the alphabetical order, so the stored list is
    // normalised no matter how the table is currently displayed.
    const ordered = typed.commands
      .map((command, i) => ({ command, sudo: typed.flags[i] }))
      .sort((a, b) => a.command.localeCompare(b.command));
    const commands = ordered.map((item) => item.command);
    const flags = ordered.map((item) => item.sudo);

    // Nothing left to store: offer to delete the target configuration.
    if (commands.length === 0) {
      const ok = await confirm('Are you sure you want to delete this target configuration?');
      if (!ok) return;
      await doDelete(true);
      return;
    }

    if (commands.includes(SUDO_ALLOWED_WILDCARD) && commands.length > 1) {
      showError("'*' must be the only command");
      return;
    }

    const storedCommands = Array.isArray(entry.commands) ? entry.commands : [];
    const storedFlags = sudoFlagsFor(storedCommands, entry.sudo_allowed);
    if (sameList(commands, storedCommands) && sameList(flags, storedFlags)) {
      close();
      return;
    }

    const sudoAllowed = serializeSudoAllowed(commands, flags);
    const previousCommands = entry.commands;
    const previousSudo = entry.sudo_allowed;
    // Optimistic in-memory commit keeps any queued payload current.
    entry.commands = commands;
    entry.sudo_allowed = sudoAllowed;
    setBusy(true);

    let res;
    try {
      res = await enqueueCommandsPut(() =>
        ctx.networks.map((network, i) =>
          i === ctx.netIdx
            ? { ...network, rules: ctx.rules.map((rule) => ({ ...rule })) }
            : network
        )
      );
    } catch (e) {
      entry.commands = previousCommands;
      entry.sudo_allowed = previousSudo;
      setBusy(false);
      showError('Failed to save');
      return;
    }
    if (!res.ok) {
      entry.commands = previousCommands;
      entry.sudo_allowed = previousSudo;
      setBusy(false);
      showError(await responseErrorMessage(res, 'Failed to save'));
      return;
    }

    close();
    showToast('Commands updated');
    renderCommandsCell(cell, commands, sudoAllowed);
  }

  /**
   * Delete this target configuration (header Delete button, empty save).
   *
   * @param {boolean} alreadyConfirmed - true when the caller already asked
   * @returns {Promise<void>} resolves once the modal closed or the request
   *   failed (the failure is shown inline and the modal stays open)
   */
  async function doDelete(alreadyConfirmed) {
    if (busy) return;
    clearError();
    if (!alreadyConfirmed) {
      const ok = await confirm('Are you sure you want to delete this target configuration?');
      if (!ok) return;
    }
    if (ctx.rules.length <= 1) {
      showError(
        'A network rule needs at least one target configuration — delete the rule instead'
      );
      return;
    }
    setBusy(true);

    let res;
    try {
      res = await enqueueCommandsPut(() =>
        ctx.networks.map((network, i) =>
          i === ctx.netIdx
            ? { ...network, rules: ctx.rules.filter((_, j) => j !== entryIdx) }
            : network
        )
      );
    } catch (e) {
      setBusy(false);
      showError('Failed to save');
      return;
    }
    if (!res.ok) {
      setBusy(false);
      showError(await responseErrorMessage(res, 'Failed to save'));
      return;
    }

    close();
    showToast('Target deleted');
    renderRules();
  }

  saveBtn.addEventListener('click', () => { doSave(); });
  deleteBtn.addEventListener('click', () => { doDelete(false); });
  cancelBtn.addEventListener('click', close);

  overlay.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (busy) return;
      e.preventDefault();
      e.stopPropagation();
      close();
      return;
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      doSave();
    }
  });

  // Seed the table: one row per stored command, then the trailing blank row.
  const commands = Array.isArray(entry.commands) ? entry.commands : [];
  const flags = sudoFlagsFor(commands, entry.sudo_allowed);
  commands.forEach((command, i) => addRow(command, flags[i], false));
  const trailingRow = addRow('', false, true);
  (rows.length > 1 ? rows[0].input : trailingRow.input).focus();
}

/**
 * Make one Network Rules Commands cell open the modal editor.
 *
 * @param {HTMLTableCellElement} cell - the Commands cell
 * @param {Object} entry - the rule entry this cell renders
 * @param {number} entryIdx - index of the entry within its network's rules
 * @param {Object} ctx - rendering context captured by the caller
 * @returns {void}
 */
function attachCommandsEditor(cell, entry, entryIdx, ctx) {
  if (!entry || typeof entry !== 'object') return;

  const targets = (Array.isArray(entry.targets) ? entry.targets : []).join(', ') || '(none)';
  cell.classList.add('commands-cell');
  cell.tabIndex = 0;
  cell.title = 'Click to edit';
  cell.setAttribute('aria-label', `Edit commands for ${targets}`);

  const open = () => openCommandsModal(cell, entry, entryIdx, ctx);
  cell.addEventListener('click', open);
  cell.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      open();
    }
  });
}

// ===========================================================================
// Targets Modal + Range Editor (Network Rules)
// ===========================================================================

/** IPv4 dotted-quad check: four decimal octets, no leading zeros. */
function isValidIPv4(address) {
  const parts = address.split('.');
  if (parts.length !== 4) return false;
  return parts.every((part) => {
    if (!/^\d{1,3}$/.test(part)) return false;
    if (part.length > 1 && part.startsWith('0')) return false;
    return Number(part) <= 255;
  });
}

/**
 * Check a CIDR string the same way lib/config.py does: IPv4 or IPv6, with or
 * without a prefix length, host bits tolerated (e.g. '10.1.2.3/8' is accepted
 * and a bare address means /32 or /128).
 *
 * @param {string} value - candidate range text
 * @returns {boolean} true when the backend would accept the CIDR shape
 */
function isValidCidr(value) {
  const text = String(value || '').trim();
  if (!text) return false;
  const slash = text.indexOf('/');
  const address = slash === -1 ? text : text.slice(0, slash);
  const prefixText = slash === -1 ? null : text.slice(slash + 1);
  if (!address) return false;

  const isV6 = address.includes(':');
  if (isV6) {
    try {
      // The WHATWG URL parser validates and normalises IPv6 literals.
      new URL(`http://[${address}]/`);
    } catch (e) {
      return false;
    }
  } else if (!isValidIPv4(address)) {
    return false;
  }

  if (prefixText === null) return true;
  if (!/^\d{1,3}$/.test(prefixText)) return false;
  return Number(prefixText) <= (isV6 ? 128 : 32);
}

/**
 * Render the read-only Targets cell content.
 *
 * @param {HTMLTableCellElement} cell - the Targets cell
 * @param {string[]} targets - stored target list
 * @returns {void}
 */
function renderTargetsCell(cell, targets) {
  const list = Array.isArray(targets) ? targets : [];
  cell.textContent = list.join(', ') || '(none)';
}

/**
 * Make one Network Rules Targets cell open the targets modal.
 *
 * @param {HTMLTableCellElement} cell - the Targets cell
 * @param {Object} entry - the rule entry this cell renders
 * @param {number} entryIdx - index of the entry within its network's rules
 * @param {Object} ctx - rendering context captured by the caller
 * @returns {void}
 */
function attachTargetsEditor(cell, entry, entryIdx, ctx) {
  if (!entry || typeof entry !== 'object') return;

  cell.classList.add('editable-cell');
  cell.tabIndex = 0;
  cell.title = 'Click to edit';
  const current = Array.isArray(entry.targets) ? entry.targets : [];
  cell.setAttribute('aria-label', `Edit targets (${current.join(', ') || 'none'})`);

  const open = () => openTargetsModal(cell, entry, entryIdx, ctx);
  cell.addEventListener('click', open);
  cell.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      open();
    }
  });
}

/**
 * Open the modal targets editor for one Network Rules target configuration.
 *
 * A table holds one dropdown per target, listing only the targets that are not
 * already used by another row (plus the row's own value). An "All targets"
 * checkbox clears the list without touching anything until Save; unticking it
 * brings the rows back. A trailing blank row appears only while unused targets
 * remain. Save writes `["*"]` when All is ticked, otherwise the selected list;
 * Delete removes the whole target configuration (last entry refused). Blur and
 * backdrop clicks do nothing, Escape cancels, Ctrl/Cmd+Enter saves.
 *
 * @param {HTMLTableCellElement} cell - the Targets cell that opened the modal
 * @param {Object} entry - the rule entry being edited
 * @param {number} entryIdx - index of that entry inside its network's rules
 * @param {Object} ctx - rendering context captured by the caller
 * @param {Object[]} ctx.networks - full in-memory networks array
 * @param {number} ctx.netIdx - index of the entry's network in `networks`
 * @param {Object[]} ctx.rules - the network's rules array
 * @param {string[]} ctx.sshTargets - configured SSH target ids
 * @returns {void}
 */
function openTargetsModal(cell, entry, entryIdx, ctx) {
  if (!entry || typeof entry !== 'object') return;

  const allTargets = Array.isArray(ctx.sshTargets) ? ctx.sshTargets.slice() : [];
  const storedTargets = Array.isArray(entry.targets) ? entry.targets.slice() : [];
  const storedAll = storedTargets.includes('*');

  const container = document.getElementById('modal-container');

  // Overlay: inert on click — losing focus must never save or cancel.
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay fixed inset-0 z-40 flex items-center justify-center';

  const card = document.createElement('div');
  card.className = 'bg-white rounded-lg shadow-xl w-full max-w-xl mx-4 max-h-[90vh] flex flex-col';
  overlay.appendChild(card);

  // Header: title plus Save / Delete / Cancel on the right
  const header = document.createElement('div');
  header.className = 'flex items-center justify-between gap-4 px-6 py-4 border-b';
  const h3 = document.createElement('h3');
  h3.className = 'text-lg font-semibold truncate flex-1 min-w-0';
  const networkName = (ctx.networks[ctx.netIdx] || {}).name || 'network';
  h3.textContent = `Targets for ${networkName}`;

  const actions = document.createElement('div');
  actions.className = 'flex items-center gap-2 flex-shrink-0';

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.id = 'm-targets-save';
  saveBtn.className = 'px-3 py-1.5 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm';
  saveBtn.textContent = 'Save';

  const deleteBtn = document.createElement('button');
  deleteBtn.type = 'button';
  deleteBtn.id = 'm-targets-delete';
  deleteBtn.className = 'px-3 py-1.5 bg-red-600 text-white rounded hover:bg-red-700 text-sm';
  deleteBtn.textContent = 'Delete';

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.id = 'm-targets-cancel';
  cancelBtn.className = 'px-3 py-1.5 text-gray-700 bg-gray-200 rounded hover:bg-gray-300 text-sm';
  cancelBtn.textContent = 'Cancel';

  actions.appendChild(saveBtn);
  actions.appendChild(deleteBtn);
  actions.appendChild(cancelBtn);
  header.appendChild(h3);
  header.appendChild(actions);
  card.appendChild(header);

  // Body
  const body = document.createElement('div');
  body.className = 'px-6 py-4 overflow-y-auto flex-1';

  // "All targets" checkbox: clears the list on screen, persisted on Save only.
  const allWrap = document.createElement('label');
  allWrap.className = 'flex items-center gap-2 mb-4 text-sm text-gray-700 cursor-pointer';
  const allBox = document.createElement('input');
  allBox.type = 'checkbox';
  allBox.id = 'm-targets-all';
  allBox.className = 'h-4 w-4';
  allBox.checked = storedAll;
  const allLabel = document.createElement('span');
  allLabel.textContent = 'All targets (*)';
  allWrap.appendChild(allBox);
  allWrap.appendChild(allLabel);
  body.appendChild(allWrap);

  const table = document.createElement('table');
  table.id = 'm-targets-table';
  table.className = 'min-w-full text-sm';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  [
    { text: 'Target', className: 'text-left font-medium text-gray-600 pb-2 pr-2' },
    { text: '', className: 'w-8' },
  ].forEach((spec) => {
    const th = document.createElement('th');
    th.className = spec.className;
    th.textContent = spec.text;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  body.appendChild(table);

  const errorP = document.createElement('p');
  errorP.id = 'm-targets-error';
  errorP.className = 'text-red-600 text-sm mt-3 hidden';
  body.appendChild(errorP);
  card.appendChild(body);

  container.appendChild(overlay);

  const rows = [];
  let busy = false;

  /** Show an inline error, keeping the current selection. */
  function showError(message) {
    errorP.textContent = message;
    errorP.classList.remove('hidden');
  }

  /** Clear the inline error area. */
  function clearError() {
    errorP.textContent = '';
    errorP.classList.add('hidden');
  }

  /** Disable the header buttons while a request is in flight. */
  function setBusy(next) {
    busy = next;
    [saveBtn, deleteBtn, cancelBtn].forEach((btn) => { btn.disabled = next; });
    [saveBtn, deleteBtn, cancelBtn].forEach((btn) => btn.classList.toggle('opacity-50', next));
  }

  /** Close the modal without saving. */
  function close() {
    overlay.remove();
  }

  /** Apply the All-targets visibility toggle. */
  function syncAllVisibility() {
    table.classList.toggle('hidden', allBox.checked);
  }

  /**
   * Fill a row's select with the options currently available to it.
   *
   * @param {Object} row - the row record
   * @param {string[]} used - values selected by every row
   * @returns {void}
   */
  function fillOptions(row, used) {
    const own = row.select.value;
    const previous = own;
    row.select.textContent = '';
    if (row.trailing) {
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = 'Select target…';
      row.select.appendChild(blank);
    }
    const available = allTargets.filter(
      (target) => target === previous || !used.includes(target)
    );
    // Keep a stale value visible so it can be inspected or removed.
    if (previous && !available.includes(previous)) available.unshift(previous);
    available.forEach((target) => {
      const option = document.createElement('option');
      option.value = target;
      option.textContent = target;
      row.select.appendChild(option);
    });
    row.select.value = available.includes(previous) ? previous : '';
  }

  /**
   * Rebuild the option lists and keep exactly one trailing row while unused
   * targets remain.
   *
   * @returns {void}
   */
  function sync() {
    const used = rows
      .filter((row) => !row.trailing)
      .map((row) => row.select.value)
      .filter(Boolean);
    rows.forEach((row) => fillOptions(row, used));
    const free = allTargets.filter((target) => !used.includes(target));
    const trailingRows = rows.filter((row) => row.trailing);
    if (free.length > 0 && trailingRows.length === 0) {
      const row = addRow('', true);
      fillOptions(row, used);
    } else if (free.length === 0) {
      trailingRows.forEach((row) => removeRow(row));
    }
    syncAllVisibility();
  }

  /**
   * Append a row.
   *
   * @param {string} value - selected target
   * @param {boolean} trailing - true for the blank "add target" row
   * @returns {Object} the row record
   */
  function addRow(value, trailing) {
    const tr = document.createElement('tr');

    const selectTd = document.createElement('td');
    selectTd.className = 'py-1 pr-2';
    const select = document.createElement('select');
    select.className = 'w-full px-2 py-1 border border-gray-300 rounded text-sm font-mono';
    select.setAttribute('aria-label', 'Target');
    selectTd.appendChild(select);

    const removeTd = document.createElement('td');
    removeTd.className = 'py-1 text-right';
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.textContent = '\u00d7';
    removeBtn.title = 'Remove target';
    removeBtn.setAttribute('aria-label', 'Remove target');
    removeBtn.className = 'text-gray-400 hover:text-red-600 text-lg leading-none px-1';
    removeTd.appendChild(removeBtn);

    tr.appendChild(selectTd);
    tr.appendChild(removeTd);
    tbody.appendChild(tr);

    const row = { tr, select, removeBtn, removeTd, trailing: !!trailing };
    rows.push(row);

    if (value) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
      select.value = value;
    }
    if (trailing) {
      removeTd.classList.add('invisible');
      removeBtn.disabled = true;
    }

    removeBtn.addEventListener('click', () => {
      if (row.trailing) return;
      removeRow(row);
      sync();
    });

    select.addEventListener('change', () => {
      if (!row.trailing && !select.value) return;
      if (row.trailing && select.value) promoteTrailing(row);
      sync();
    });

    return row;
  }

  /** Remove a row from the table and the model. */
  function removeRow(row) {
    const i = rows.indexOf(row);
    if (i >= 0) rows.splice(i, 1);
    row.tr.remove();
  }

  /** Turn the trailing row into a normal row once it holds a target. */
  function promoteTrailing(row) {
    row.trailing = false;
    row.removeBtn.disabled = false;
    row.removeTd.classList.remove('invisible');
  }

  /** Save the selection (header Save button, Ctrl/Cmd+Enter). */
  async function doSave() {
    if (busy) return;
    clearError();

    let targets;
    if (allBox.checked) {
      targets = ['*'];
    } else {
      targets = rows
        .filter((row) => !row.trailing)
        .map((row) => row.select.value)
        .filter(Boolean);
      const duplicate = targets.find((t, i) => targets.indexOf(t) !== i);
      if (duplicate) {
        showError(`Duplicate target: ${duplicate}`);
        return;
      }
    }

    if (targets.length === 0) {
      const ok = await confirm('Are you sure you want to delete this target configuration?');
      if (!ok) return;
      await doDelete(true);
      return;
    }

    const current = Array.isArray(entry.targets) ? entry.targets : [];
    if (sameList(targets, current)) {
      close();
      return;
    }

    const previous = entry.targets;
    entry.targets = targets;
    setBusy(true);

    let res;
    try {
      res = await enqueueCommandsPut(() =>
        ctx.networks.map((network, i) =>
          i === ctx.netIdx
            ? { ...network, rules: ctx.rules.map((rule) => ({ ...rule })) }
            : network
        )
      );
    } catch (e) {
      entry.targets = previous;
      setBusy(false);
      showError('Failed to save');
      return;
    }
    if (!res.ok) {
      entry.targets = previous;
      setBusy(false);
      showError(await responseErrorMessage(res, 'Failed to save'));
      return;
    }

    close();
    showToast('Targets updated');
    renderTargetsCell(cell, targets);
  }

  /**
   * Delete this target configuration (header Delete button, empty save).
   *
   * @param {boolean} alreadyConfirmed - true when the caller already asked
   * @returns {Promise<void>} resolves once the modal closed or the request
   *   failed (shown inline, modal stays open)
   */
  async function doDelete(alreadyConfirmed) {
    if (busy) return;
    clearError();
    if (!alreadyConfirmed) {
      const ok = await confirm('Are you sure you want to delete this target configuration?');
      if (!ok) return;
    }
    if (ctx.rules.length <= 1) {
      showError(
        'A network rule needs at least one target configuration — delete the rule instead'
      );
      return;
    }
    setBusy(true);

    let res;
    try {
      res = await enqueueCommandsPut(() =>
        ctx.networks.map((network, i) =>
          i === ctx.netIdx
            ? { ...network, rules: ctx.rules.filter((_, j) => j !== entryIdx) }
            : network
        )
      );
    } catch (e) {
      setBusy(false);
      showError('Failed to save');
      return;
    }
    if (!res.ok) {
      setBusy(false);
      showError(await responseErrorMessage(res, 'Failed to save'));
      return;
    }

    close();
    showToast('Target deleted');
    renderRules();
  }

  saveBtn.addEventListener('click', () => { doSave(); });
  deleteBtn.addEventListener('click', () => { doDelete(false); });
  cancelBtn.addEventListener('click', close);

  allBox.addEventListener('change', () => { clearError(); syncAllVisibility(); });

  overlay.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (busy) return;
      e.preventDefault();
      e.stopPropagation();
      close();
      return;
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      doSave();
    }
  });

  // Seed: one row per concrete stored target, then let sync() decide whether a
  // trailing row is needed (it is not when every target is already used).
  storedTargets.filter((target) => target !== '*').forEach((target) => addRow(target, false));
  sync();
  if (allBox.checked) {
    syncAllVisibility();
  } else {
    const first = rows.find((row) => !row.trailing);
    if (first) first.select.focus();
  }
}

/**
 * Rules every new network starts with: `ls` on all targets, so the network is
 * valid the moment it is created and can be widened in the table afterwards.
 *
 * @returns {Object[]} a fresh single-rule list
 */
function newNetworkRules() {
  return [{ targets: ['*'], commands: ['ls'] }];
}

/**
 * Closes whichever inline editor is currently open, if any. Editors replace
 * each other so a field left open by a failed blur save never blocks the table.
 */
let activeInlineEditor = null;

/**
 * Make a Network Rules table cell inline-editable.
 *
 * Clicking the cell turns its text into a field. Enter, Ctrl/Cmd+Enter and
 * losing focus all validate the value and save it; an invalid or rejected
 * value keeps the field editable with the wrong text and an inline message
 * (an error toast when the field was already abandoned); Escape cancels back
 * to the stored value. Only one inline editor is open at a time: opening
 * another one closes the previous editor to its stored value.
 *
 * @param {HTMLTableCellElement} cell - the cell to make editable
 * @param {Object} spec - editor behaviour
 * @param {string} spec.field - accessible name of the input
 * @param {string} spec.ariaLabel - accessible name of the cell
 * @param {Function} spec.read - () => stored text
 * @param {Function} spec.validate - (text) => error message, or null when valid
 * @param {Function} spec.commit - async (text) => error message on failure,
 *   null on success; applies the change to the underlying model and rolls it
 *   back itself when saving fails
 * @param {string} spec.successToast - toast shown after a successful save
 * @param {boolean} [spec.mono] - render the field in a monospace font
 * @returns {void}
 */
function attachInlineEditor(cell, spec) {
  cell.classList.add('editable-cell');
  cell.tabIndex = 0;
  cell.title = 'Click to edit';
  cell.setAttribute('aria-label', spec.ariaLabel);

  let editing = false;

  function open() {
    if (editing) return;
    // Only one inline editor may be open at a time: the previous one gives way.
    if (activeInlineEditor) activeInlineEditor();

    editing = true;
    cell.classList.add('is-editing');
    cell.textContent = '';

    const input = document.createElement('input');
    input.type = 'text';
    input.value = spec.read();
    input.className = 'w-full px-2 py-1 border border-gray-300 rounded text-sm'
      + (spec.mono ? ' font-mono' : '');
    input.setAttribute('aria-label', spec.field);
    const errorP = document.createElement('p');
    errorP.className = 'text-red-600 text-xs mt-1 hidden';
    cell.appendChild(input);
    cell.appendChild(errorP);
    input.focus();
    input.select();

    let handled = false;
    let busy = false;

    /** Leave the editor, showing `text` as the read-only value. */
    function close(text) {
      editing = false;
      cell.classList.remove('is-editing');
      cell.textContent = text;
      if (activeInlineEditor === closer) activeInlineEditor = null;
    }

    /** Abandon the editor (another cell was clicked): stored value comes back. */
    const closer = () => {
      if (handled || busy) return;
      handled = true;
      close(spec.read());
    };

    activeInlineEditor = closer;

    /**
     * Report a failed save: inline while the field is open, as an error toast
     * once another editor has taken over.
     */
    function showError(message) {
      if (!editing) {
        showToast(message, 'error');
        return;
      }
      errorP.textContent = message;
      errorP.classList.remove('hidden');
      input.classList.add('border-red-500');
      input.classList.remove('border-gray-300');
    }

    /** Validate, then persist the value (Enter, Ctrl+Enter, or blur). */
    async function save() {
      if (handled) return;
      const value = input.value.trim();

      if (value === spec.read()) {
        handled = true;
        close(spec.read());
        return;
      }
      const invalid = spec.validate(value);
      if (invalid) {
        showError(invalid);
        return;
      }

      handled = true;
      busy = true;
      const failure = await spec.commit(value);
      if (failure) {
        handled = false;
        busy = false;
        showError(failure);
        return;
      }
      close(value);
      showToast(spec.successToast);
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (busy) return;
        e.preventDefault();
        e.stopPropagation();
        handled = true;
        close(spec.read());
        return;
      }
      if (e.key === 'Enter') {
        if (busy) return;
        e.preventDefault();
        save();
      }
    });

    // Losing focus saves, exactly like Enter: a rejected value keeps the field
    // open with the wrong text and the inline message.
    input.addEventListener('blur', () => {
      if (handled || busy) return;
      save();
    });
  }

  cell.addEventListener('click', open);
  cell.addEventListener('keydown', (e) => {
    // Keys pressed inside the open editor belong to the input: letting them
    // bubble would re-open the editor right after Enter closed it.
    if (e.target !== cell) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      open();
    }
  });
}

/**
 * Persist a field of one network by re-sending the whole networks array.
 *
 * @param {Object} network - the network object to mutate
 * @param {string} key - `name` or `range`
 * @param {string} value - the new value
 * @param {number} netIdx - index of that network in `networks`
 * @param {Object} ctx - rendering context captured by the caller
 * @param {Object[]} ctx.networks - full in-memory networks array
 * @returns {Promise<string|null>} error message on failure, null on success
 */
async function saveNetworkField(network, key, value, netIdx, ctx) {
  const previous = network[key];
  // Optimistic in-memory commit keeps any queued payload current.
  network[key] = value;

  let res;
  try {
    res = await enqueueCommandsPut(() =>
      ctx.networks.map((entry, i) => (i === netIdx ? { ...entry } : entry))
    );
  } catch (e) {
    network[key] = previous;
    return 'Failed to save';
  }
  if (!res.ok) {
    network[key] = previous;
    return responseErrorMessage(res, 'Failed to save');
  }
  return null;
}

/**
 * Make one Network Rules Range cell inline-editable.
 *
 * Enter or Ctrl/Cmd+Enter validates the CIDR and saves; a rejected or invalid
 * value keeps the field editable with the wrong text and an inline message;
 * Escape (and blur) cancel back to the stored range. Only this network's
 * `range` is ever written.
 *
 * @param {HTMLTableCellElement} cell - the Range cell
 * @param {Object} network - the network this cell renders
 * @param {number} netIdx - index of that network in `networks`
 * @param {Object} ctx - rendering context captured by the caller
 * @returns {void}
 */
function attachRangeEditor(cell, network, netIdx, ctx) {
  if (!network || typeof network !== 'object') return;
  attachInlineEditor(cell, {
    field: 'CIDR range',
    ariaLabel: `Edit CIDR range for ${network.name || 'network'}`,
    mono: true,
    read: () => (typeof network.range === 'string' ? network.range : ''),
    validate: (text) => (isValidCidr(text) ? null : 'Not a valid CIDR'),
    successToast: 'Range updated',
    commit: (value) => saveNetworkField(network, 'range', value, netIdx, ctx),
  });
}

/**
 * Make one Network Rules Name cell inline-editable.
 *
 * A network name may be changed in place; the same keys as the Range editor
 * apply (Enter/Ctrl+Enter save, Escape and blur cancel).
 *
 * @param {HTMLTableCellElement} cell - the Name cell
 * @param {Object} network - the network this cell renders
 * @param {number} netIdx - index of that network in `networks`
 * @param {Object} ctx - rendering context captured by the caller
 * @returns {void}
 */
function attachNameEditor(cell, network, netIdx, ctx) {
  if (!network || typeof network !== 'object') return;
  attachInlineEditor(cell, {
    field: 'Network name',
    ariaLabel: `Edit name for ${network.name || 'network'}`,
    read: () => (typeof network.name === 'string' ? network.name : ''),
    validate: (text) => (text ? null : 'Name is required'),
    successToast: 'Name updated',
    commit: (value) => saveNetworkField(network, 'name', value, netIdx, ctx),
  });
}

function renderNetworkRules(container, networks, sshTargets) {
  // Header
  const header = document.createElement('div');
  header.className = 'flex items-center justify-between mb-4';
  const addBtn = document.createElement('button');
  addBtn.className = 'bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm';
  addBtn.textContent = 'Add Network Rule';
  header.appendChild(addBtn);
  container.appendChild(header);

  // Table
  const tableWrap = document.createElement('div');
  tableWrap.className = 'overflow-x-auto';
  const table = document.createElement('table');
  table.className = 'min-w-full bg-white rounded-lg shadow';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  headRow.className = 'bg-gray-50 text-left text-sm text-gray-600';
  ['Name', 'Range', 'Targets', 'Commands', 'Actions'].forEach((h) => {
    const th = document.createElement('th');
    th.className = 'px-4 py-3 font-medium';
    th.textContent = h;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  if (networks.length === 0) {
    const emptyRow = document.createElement('tr');
    const emptyCell = document.createElement('td');
    emptyCell.colSpan = 5;
    emptyCell.className = 'px-4 py-8 text-center text-gray-500';
    emptyCell.textContent = 'No network rules configured.';
    emptyRow.appendChild(emptyCell);
    tbody.appendChild(emptyRow);
  }

  networks.forEach((net, idx) => {
    const rules = net.rules || [];

    const nameCell = document.createElement('td');
    nameCell.className = 'px-4 py-3 font-medium text-sm';
    nameCell.textContent = net.name || `Network ${idx}`;
    attachNameEditor(nameCell, net, idx, { networks });

    const rangeCell = document.createElement('td');
    rangeCell.className = 'px-4 py-3 text-sm font-mono';
    rangeCell.textContent = net.range || '';
    attachRangeEditor(rangeCell, net, idx, { networks });

    const actionsCell = document.createElement('td');
    actionsCell.className = 'px-4 py-3';
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'text-red-600 hover:text-red-800 text-sm';
    deleteBtn.textContent = 'Delete';
    actionsCell.appendChild(deleteBtn);

    deleteBtn.addEventListener('click', async () => {
      const ok = await confirm(`Delete network rule "${net.name || `Network ${idx}`}"?`);
      if (!ok) return;
      const updatedNetworks = networks.filter((_, i) => i !== idx);
      const r = await api('PUT', '/config/allowed_commands', { networks: updatedNetworks });
      if (!r.ok) {
        const err = await r.json();
        showToast(err.message || 'Failed to delete', 'error');
        return;
      }
      showToast('Network rule deleted');
      renderRules();
    });

    appendRuleGroupRows(tbody, {
      leading: [nameCell, rangeCell],
      trailing: [actionsCell],
      entries: rules,
      placeholderColspan: 2,
      showSudo: true,
      onCommandsCell: (cmdsCell, entry, entryIdx) =>
        attachCommandsEditor(cmdsCell, entry, entryIdx, { networks, netIdx: idx, rules }),
      onTargetsCell: (targetsCell, entry, entryIdx) =>
        attachTargetsEditor(targetsCell, entry, entryIdx, {
          networks, netIdx: idx, rules, sshTargets,
        }),
    });
  });

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  container.appendChild(tableWrap);

  addBtn.addEventListener('click', () => {
    showModal('Add Network Rule', () => {
      const div = el('div', 'space-y-4');
      div.appendChild(makeFormGroup('Name', { id: 'm-net-name', placeholder: 'e.g. office-network' }));
      div.appendChild(makeFormGroup('CIDR Range', { id: 'm-net-range', placeholder: 'e.g. 10.0.0.0/8', class: 'w-full px-3 py-2 border rounded text-sm font-mono' }));
      const helpP = el('p', 'text-xs text-gray-500');
      helpP.textContent = 'Starts with one rule allowing "ls" on all targets — '
        + 'edit targets and commands in the table afterwards.';
      div.appendChild(helpP);
      return div;
    }, async (body) => {
      const name = body.querySelector('#m-net-name').value.trim();
      const range = body.querySelector('#m-net-range').value.trim();
      if (!name) throw new Error('Name is required');
      if (!range) throw new Error('Range is required');
      if (!isValidCidr(range)) throw new Error('Not a valid CIDR');
      const updatedNetworks = [
        ...networks,
        { name, range, rules: newNetworkRules() },
      ];
      const r = await api('PUT', '/config/allowed_commands', { networks: updatedNetworks });
      if (!r.ok) {
        const err = await r.json();
        throw new Error(err.message || 'Failed to save');
      }
      showToast('Network rule added');
      renderRules();
    });
  });
}

// ===========================================================================
// Page: Settings
// ===========================================================================

async function renderSettings() {
  const main = document.getElementById('main-content');
  showLoading(main);

  try {
    const res = await api('GET', '/config/settings');
    if (!res.ok) throw new Error('Failed to load settings');
    const data = await res.json();
    const settings = data.data || {};

    main.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'container mx-auto px-4 py-6 max-w-3xl';

    const title = document.createElement('h1');
    title.className = 'text-2xl font-bold text-gray-800 mb-6';
    title.textContent = 'Settings';
    container.appendChild(title);

    // Settings form
    const form = document.createElement('form');
    form.id = 'settings-form';
    form.className = 'space-y-6';

    function addGroup(heading, fields) {
      const group = document.createElement('div');
      group.className = 'bg-white rounded-lg shadow p-6';
      const h2 = document.createElement('h2');
      h2.className = 'text-lg font-semibold text-gray-700 mb-4';
      h2.textContent = heading;
      group.appendChild(h2);

      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

      fields.forEach((f) => {
        const fieldDiv = document.createElement('div');
        const label = document.createElement('label');
        label.className = 'block text-sm font-medium text-gray-700 mb-1';
        label.textContent = f.label;
        fieldDiv.appendChild(label);

        let input;
        if (f.type === 'toggle') {
          input = document.createElement('input');
          input.type = 'checkbox';
          input.id = f.id;
          input.checked = !!settings[f.key];
          input.className = 'h-4 w-4 text-blue-600 rounded';
        } else if (f.type === 'select') {
          input = document.createElement('select');
          input.id = f.id;
          input.className = 'w-full px-3 py-2 border rounded text-sm';
          f.options.forEach((opt) => {
            const option = document.createElement('option');
            option.value = opt;
            option.textContent = opt;
            if (settings[f.key] === opt) option.selected = true;
            input.appendChild(option);
          });
        } else {
          input = document.createElement('input');
          input.type = f.type || 'text';
          input.id = f.id;
          input.value = settings[f.key] != null ? settings[f.key] : (f.default || '');
          input.className = 'w-full px-3 py-2 border rounded text-sm';
          if (f.placeholder) input.placeholder = f.placeholder;
        }
        fieldDiv.appendChild(input);

        const errorP = document.createElement('p');
        errorP.id = f.id + '-error';
        errorP.className = 'text-red-600 text-xs mt-1 hidden';
        fieldDiv.appendChild(errorP);

        grid.appendChild(fieldDiv);
      });

      group.appendChild(grid);
      form.appendChild(group);
    }

    addGroup('Output & Timeouts', [
      { id: 's-max-output', key: 'max_output_length', label: 'Max Output Length', type: 'text', placeholder: 'e.g. 100KB', default: '' },
      { id: 's-timeout', key: 'command_timeout_max', label: 'Command Timeout (s)', type: 'number', default: '' },
    ]);

    addGroup('Retry & Circuit Breaker', [
      { id: 's-retry-max', key: 'retry_max_attempts', label: 'Max Retry Attempts', type: 'number', default: '' },
      { id: 's-retry-backoff', key: 'retry_backoff_base_seconds', label: 'Retry Backoff (s)', type: 'number', default: '' },
      { id: 's-cb-threshold', key: 'circuit_breaker_failure_threshold', label: 'CB Failure Threshold', type: 'number', default: '' },
      { id: 's-cb-timeout', key: 'circuit_breaker_timeout_seconds', label: 'CB Recovery Timeout (s)', type: 'number', default: '' },
    ]);

    addGroup('Logging', [
      { id: 's-log-level', key: 'log_level', label: 'Log Level', type: 'select', options: ['DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'] },
      { id: 's-max-log', key: 'max_log_output', label: 'Max Log Output', type: 'number', default: '' },
      { id: 's-compress', key: 'compress_rotated', label: 'Compress Rotated Logs', type: 'toggle' },
    ]);

    addGroup('Connection Pool', [
      { id: 's-pool-max', key: 'pool_max_connections_per_target', label: 'Max Conn/Target', type: 'number', default: '' },
      { id: 's-pool-idle', key: 'pool_idle_timeout_seconds', label: 'Pool Idle Timeout (s)', type: 'number', default: '' },
      { id: 's-pool-cleanup', key: 'pool_cleanup_interval_seconds', label: 'Pool Cleanup Interval (s)', type: 'number', default: '' },
      { id: 's-max-ssh', key: 'max_concurrent_ssh_connections', label: 'Max Concurrent SSH', type: 'number', default: '' },
    ]);

    addGroup('SFTP', [
      { id: 's-sftp-root', key: 'sftp.sandbox_root', label: 'Sandbox Root', type: 'text', placeholder: 'e.g. /home', default: '' },
      { id: 's-sftp-path', key: 'sftp.max_path_length', label: 'Max Path Length', type: 'number', default: '' },
    ]);

    addGroup('Other', [
      { id: 's-debounce', key: 'watcher_debounce_seconds', label: 'Watcher Debounce (s)', type: 'number', default: '' },
      { id: 's-proxies', key: 'trusted_proxies', label: 'Trusted Proxies (comma-separated)', type: 'text', placeholder: 'e.g. 10.0.0.0/8', default: '' },
    ]);

    // Save button
    const saveWrap = document.createElement('div');
    saveWrap.className = 'flex justify-end';
    const saveBtn = document.createElement('button');
    saveBtn.type = 'submit';
    saveBtn.className = 'bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 text-sm font-medium';
    saveBtn.textContent = 'Save Settings';
    saveWrap.appendChild(saveBtn);
    form.appendChild(saveWrap);

    container.appendChild(form);
    main.appendChild(container);

    // Save handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const payload = {};

        // Simple fields
        const simpleFields = [
          { id: 's-max-output', key: 'max_output_length', parse: (v) => v || undefined },
          { id: 's-timeout', key: 'command_timeout_max', parse: (v) => v ? parseInt(v, 10) : undefined },
          { id: 's-retry-max', key: 'retry_max_attempts', parse: (v) => v ? parseInt(v, 10) : undefined },
          { id: 's-retry-backoff', key: 'retry_backoff_base_seconds', parse: (v) => v ? parseFloat(v) : undefined },
          { id: 's-cb-threshold', key: 'circuit_breaker_failure_threshold', parse: (v) => v ? parseInt(v, 10) : undefined },
          { id: 's-cb-timeout', key: 'circuit_breaker_timeout_seconds', parse: (v) => v ? parseFloat(v) : undefined },
          { id: 's-log-level', key: 'log_level', parse: (v) => v || undefined },
          { id: 's-max-log', key: 'max_log_output', parse: (v) => v ? parseInt(v, 10) : undefined },
          { id: 's-compress', key: 'compress_rotated', parse: (v, el) => el.checked || undefined },
          { id: 's-pool-max', key: 'pool_max_connections_per_target', parse: (v) => v ? parseInt(v, 10) : undefined },
          { id: 's-pool-idle', key: 'pool_idle_timeout_seconds', parse: (v) => v ? parseFloat(v) : undefined },
          { id: 's-pool-cleanup', key: 'pool_cleanup_interval_seconds', parse: (v) => v ? parseFloat(v) : undefined },
          { id: 's-max-ssh', key: 'max_concurrent_ssh_connections', parse: (v) => v ? parseInt(v, 10) : undefined },
          { id: 's-debounce', key: 'watcher_debounce_seconds', parse: (v) => v ? parseFloat(v) : undefined },
        ];

        simpleFields.forEach(({ id, key, parse }) => {
          const el = document.getElementById(id);
          if (!el) return;
          const val = el.type === 'checkbox' ? el.checked : el.value.trim();
          const parsed = parse(val, el);
          if (parsed !== undefined) payload[key] = parsed;
        });

        // Trusted proxies (comma-separated → array)
        const proxiesEl = document.getElementById('s-proxies');
        if (proxiesEl && proxiesEl.value.trim()) {
          payload.trusted_proxies = proxiesEl.value.split(',').map(s => s.trim()).filter(Boolean);
        }

        // SFTP nested
        const sftpRoot = document.getElementById('s-sftp-root');
        const sftpPath = document.getElementById('s-sftp-path');
        const sftp = {};
        if (sftpRoot && sftpRoot.value.trim()) sftp.sandbox_root = sftpRoot.value.trim();
        if (sftpPath && sftpPath.value) sftp.max_path_length = parseInt(sftpPath.value, 10);
        if (Object.keys(sftp).length > 0) payload.sftp = sftp;

        const r = await api('PUT', '/config/settings', payload);
        if (!r.ok) {
          const err = await r.json();
          throw new Error(err.message || 'Failed to save settings');
        }
        showToast('Settings saved');
      } catch (err) {
        showToast(err.message || 'Failed to save', 'error');
      }
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Settings';
    });

  } catch (err) {
    main.innerHTML = `<div class="p-6 text-red-600">Error: ${escapeHtml(err.message)}</div>`;
  }
}

// ===========================================================================
// Page: Backups
// ===========================================================================

async function renderBackups() {
  const main = document.getElementById('main-content');
  showLoading(main);

  try {
    const res = await api('GET', '/backups');
    if (!res.ok) throw new Error('Failed to load backups');
    const data = await res.json();
    const backups = data.backups || [];

    main.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'container mx-auto px-4 py-6';

    const title = document.createElement('h1');
    title.className = 'text-2xl font-bold text-gray-800 mb-4';
    title.textContent = 'Backups';
    container.appendChild(title);

    // Table
    const tableWrap = document.createElement('div');
    tableWrap.className = 'overflow-x-auto';
    const table = document.createElement('table');
    table.className = 'min-w-full bg-white rounded-lg shadow';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    headRow.className = 'bg-gray-50 text-left text-sm text-gray-600';
    ['Filename', 'Size', 'Date', 'Actions'].forEach((h) => {
      const th = document.createElement('th');
      th.className = 'px-4 py-3 font-medium';
      th.textContent = h;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    tbody.className = 'divide-y divide-gray-200';

    if (backups.length === 0) {
      const emptyRow = document.createElement('tr');
      const emptyCell = document.createElement('td');
      emptyCell.colSpan = 4;
      emptyCell.className = 'px-4 py-8 text-center text-gray-500';
      emptyCell.textContent = 'No backups found.';
      emptyRow.appendChild(emptyCell);
      tbody.appendChild(emptyRow);
    }

    backups.forEach((backup) => {
      const row = document.createElement('tr');
      row.className = 'hover:bg-gray-50';

      const nameCell = document.createElement('td');
      nameCell.className = 'px-4 py-3 text-sm font-mono';
      nameCell.textContent = backup.name;
      row.appendChild(nameCell);

      const sizeCell = document.createElement('td');
      sizeCell.className = 'px-4 py-3 text-sm';
      sizeCell.textContent = formatBytes(backup.size_bytes || 0);
      row.appendChild(sizeCell);

      const dateCell = document.createElement('td');
      dateCell.className = 'px-4 py-3 text-sm';
      dateCell.textContent = backup.created_at || '';
      row.appendChild(dateCell);

      const actionsCell = document.createElement('td');
      actionsCell.className = 'px-4 py-3';
      const restoreBtn = document.createElement('button');
      restoreBtn.className = 'text-green-600 hover:text-green-800 text-sm mr-3';
      restoreBtn.textContent = 'Restore';
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'text-red-600 hover:text-red-800 text-sm';
      deleteBtn.textContent = 'Delete';
      actionsCell.appendChild(restoreBtn);
      actionsCell.appendChild(deleteBtn);
      row.appendChild(actionsCell);

      restoreBtn.addEventListener('click', async () => {
        const ok = await confirm(`Restore config from "${backup.name}"?`);
        if (!ok) return;
        const r = await api('POST', `/backups/${encodeURIComponent(backup.name)}/restore`);
        if (!r.ok) {
          const err = await r.json();
          showToast(err.message || 'Failed to restore', 'error');
          return;
        }
        showToast('Config restored');
        renderBackups();
      });

      deleteBtn.addEventListener('click', async () => {
        const ok = await confirm(`Delete backup "${backup.name}"?`);
        if (!ok) return;
        const r = await api('DELETE', `/backups/${encodeURIComponent(backup.name)}`);
        if (!r.ok) {
          const err = await r.json();
          showToast(err.message || 'Failed to delete', 'error');
          return;
        }
        showToast('Backup deleted');
        renderBackups();
      });

      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    tableWrap.appendChild(table);
    container.appendChild(tableWrap);
    main.appendChild(container);

  } catch (err) {
    main.innerHTML = `<div class="p-6 text-red-600">Error: ${escapeHtml(err.message)}</div>`;
  }
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.hash = '#/login';
});

// ===========================================================================
// Init
// ===========================================================================

navigate(window.location.hash || '#/login');

// ===========================================================================
// Idle Timeout (30 minutes)
// ===========================================================================

const IDLE_TIMEOUT_MS = 30 * 60 * 1000; // 30 minutes
let idleTimer = null;

function resetIdleTimer() {
  if (idleTimer !== null) clearTimeout(idleTimer);
  idleTimer = setTimeout(async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    showToast('Session expired due to inactivity', 'info');
    window.location.hash = '#/login';
  }, IDLE_TIMEOUT_MS);
}

['mousemove', 'keydown', 'click', 'scroll'].forEach((evt) => {
  document.addEventListener(evt, resetIdleTimer, { passive: true });
});
resetIdleTimer();
