<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP SSH Config</title>
  <!-- Tailwind CSS Play CDN — self-hosted from https://cdn.tailwindcss.com -->
  <script src="tailwindcss.js"></script>
  <style>
    /* Spinner animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    /* Toast slide-in */
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-animate { animation: slideIn 0.3s ease-out; }
    /* Modal overlay */
    .modal-overlay { background: rgba(0,0,0,0.5); }
    /* Active nav link */
    .nav-link { opacity: 0.7; transition: opacity 0.15s; }
    .nav-link:hover { opacity: 1; }
    .nav-link.active { opacity: 1; border-bottom: 2px solid #60a5fa; }
    /* Tab active */
    .tab-btn { border-bottom: 2px solid transparent; transition: border-color 0.15s, color 0.15s; }
    .tab-btn.active { border-bottom-color: #3b82f6; color: #1e40af; font-weight: 600; }
    /* Rule-group tables: one divider above each rule group, whole-group hover */
    .rule-group-start { border-top: 1px solid #e5e7eb; }
    .rule-group-hover { background-color: #f9fafb; }
    /* Editable Network Rules cells (Name, Range, Targets, Commands): pointer
       cursor plus a dashed underline hint on hover/focus; suppressed while an
       inline editor is open */
    .commands-cell,
    .editable-cell { cursor: pointer; }
    .commands-cell:not(.is-editing):hover,
    .commands-cell:not(.is-editing):focus,
    .editable-cell:not(.is-editing):hover,
    .editable-cell:not(.is-editing):focus {
      text-decoration: underline dashed;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Navigation bar (hidden until logged in) -->
  <nav id="navbar" class="bg-gray-800 text-white px-6 py-3 flex items-center justify-between hidden">
    <div class="flex space-x-4">
      <a href="#/targets"  class="nav-link py-1 px-2 rounded">SSH Targets</a>
      <a href="#/patterns" class="nav-link py-1 px-2 rounded">Block Patterns</a>
      <a href="#/rules"    class="nav-link py-1 px-2 rounded">Command Rules</a>
      <a href="#/settings" class="nav-link py-1 px-2 rounded">Settings</a>
      <a href="#/backups"  class="nav-link py-1 px-2 rounded">Backups</a>
    </div>
    <button id="logout-btn" class="text-red-400 hover:text-red-300 text-sm">Logout</button>
  </nav>

  <!-- Main content area -->
  <div id="main-content"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

<script>
// ===========================================================================
// API Client
// ===========================================================================

async function api(method, path, body = null) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
    },
  };
  if (body !== null) opts.body = JSON.stringify(body);
  const res = await fetch(`/api${path}`, opts);
  if (res.status === 401) {
    window.location.hash = '#/login';
    throw new Error('Unauthorized');
  }
  return res;
}

// ===========================================================================
// Toast Notifications
// ===========================================================================

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const bgColor = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
  toast.className = `toast-animate ${bgColor} text-white px-4 py-3 rounded shadow-lg text-sm max-w-sm`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity 0.3s';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ===========================================================================
// Loading State
// ===========================================================================

function showLoading(container) {
  container.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'flex justify-center py-8';
  const spinner = document.createElement('div');
  spinner.className = 'animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600';
  wrapper.appendChild(spinner);
  container.appendChild(wrapper);
}

// ===========================================================================
// DOM Helpers
// ===========================================================================

function el(tag, className) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  return e;
}

function makeFormGroup(labelText, opts) {
  const group = el('div');
  const label = el('label', 'block text-sm font-medium text-gray-700 mb-1');
  label.textContent = labelText;
  const input = el(opts.type === 'textarea' ? 'textarea' : 'input',
    opts.class || 'w-full px-3 py-2 border rounded text-sm');
  input.id = opts.id;
  if (opts.type && opts.type !== 'textarea') input.type = opts.type;
  if (opts.placeholder) input.placeholder = opts.placeholder;
  if (opts.value != null) input.value = opts.value;
  if (opts.rows) input.rows = opts.rows;
  group.appendChild(label);
  group.appendChild(input);
  return group;
}

// ===========================================================================
// Modal Dialog
// ===========================================================================

function showModal(title, buildBody, onSave, onRender) {
  const container = document.getElementById('modal-container');

  // Overlay
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay fixed inset-0 z-40 flex items-center justify-center';

  // Modal card
  const card = document.createElement('div');
  card.className = 'bg-white rounded-lg shadow-xl w-full max-w-lg mx-4 max-h-[90vh] flex flex-col';

  // Header
  const header = document.createElement('div');
  header.className = 'flex items-center justify-between px-6 py-4 border-b';
  const h2 = document.createElement('h3');
  h2.className = 'text-lg font-semibold';
  h2.textContent = title;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'text-gray-400 hover:text-gray-600 text-xl';
  closeBtn.textContent = '\u00d7';
  header.appendChild(h2);
  header.appendChild(closeBtn);
  card.appendChild(header);

  // Body
  const body = document.createElement('div');
  body.className = 'px-6 py-4 overflow-y-auto flex-1';
  const content = buildBody();
  if (content) body.appendChild(content);
  if (onRender) onRender(body);
  card.appendChild(body);

  // Error area
  const errorArea = document.createElement('div');
  errorArea.className = 'px-6 pb-2 hidden';
  const errorP = document.createElement('p');
  errorP.className = 'text-red-600 text-sm';
  errorArea.appendChild(errorP);
  card.appendChild(errorArea);

  // Footer
  const footer = document.createElement('div');
  footer.className = 'flex justify-end gap-3 px-6 py-4 border-t';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'px-4 py-2 text-gray-700 bg-gray-200 rounded hover:bg-gray-300 text-sm';
  cancelBtn.textContent = 'Cancel';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm';
  saveBtn.textContent = 'Save';
  footer.appendChild(cancelBtn);
  footer.appendChild(saveBtn);
  card.appendChild(footer);

  overlay.appendChild(card);
  container.appendChild(overlay);

  function closeModal() {
    overlay.remove();
  }

  closeBtn.addEventListener('click', closeModal);
  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    try {
      await onSave(body, errorArea, errorP);
      closeModal();
    } catch (err) {
      errorP.textContent = err.message || 'An error occurred';
      errorArea.classList.remove('hidden');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
    }
  });
}

// ===========================================================================
// Confirmation Dialog
// ===========================================================================

function confirm(message) {
  return new Promise((resolve) => {
    const container = document.getElementById('modal-container');

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay fixed inset-0 z-40 flex items-center justify-center';

    const card = document.createElement('div');
    card.className = 'bg-white rounded-lg shadow-xl w-full max-w-sm mx-4';

    const body = document.createElement('div');
    body.className = 'px-6 py-6';
    const p = document.createElement('p');
    p.className = 'text-gray-700';
    p.textContent = message;
    body.appendChild(p);
    card.appendChild(body);

    const footer = document.createElement('div');
    footer.className = 'flex justify-end gap-3 px-6 pb-4';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'px-4 py-2 text-gray-700 bg-gray-200 rounded hover:bg-gray-300 text-sm';
    cancelBtn.textContent = 'Cancel';
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-sm';
    confirmBtn.textContent = 'Confirm';
    footer.appendChild(cancelBtn);
    footer.appendChild(confirmBtn);
    card.appendChild(footer);

    overlay.appendChild(card);
    container.appendChild(overlay);

    function close(result) {
      overlay.remove();
      resolve(result);
    }

    cancelBtn.addEventListener('click', () => close(false));
    confirmBtn.addEventListener('click', () => close(true));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) close(false);
    });
  });
}

// ===========================================================================
// Utility Helpers
// ===========================================================================

function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===========================================================================
// Router
// ===========================================================================

const routes = {
  '#/login':    renderLogin,
  '#/targets':  renderTargets,
  '#/patterns': renderPatterns,
  '#/rules':    renderRules,
  '#/settings': renderSettings,
  '#/backups':  renderBackups,
};

async function navigate(hash) {
  const navbar = document.getElementById('navbar');
  if (hash !== '#/login') {
    try {
      const res = await fetch('/api/auth/session');
      if (!res.ok) {
        window.location.hash = '#/login';
        return;
      }
      navbar.classList.remove('hidden');
    } catch {
      window.location.hash = '#/login';
      return;
    }
  } else {
    navbar.classList.add('hidden');
  }
  const render = routes[hash] || renderTargets;
  render();
  updateActiveNav(hash);
}

function updateActiveNav(hash) {
  document.querySelectorAll('.nav-link').forEach((link) => {
    link.classList.toggle('active', link.getAttribute('href') === hash);
  });
}

window.addEventListener('hashchange', () => navigate(window.location.hash));

// ===========================================================================
// Page: Login
// ===========================================================================

function renderLogin() {
  document.getElementById('navbar').classList.add('hidden');
  const main = document.getElementById('main-content');
  main.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.className = 'min-h-screen flex items-center justify-center bg-gray-100';

  const card = document.createElement('div');
  card.className = 'bg-white p-8 rounded-lg shadow-md w-96';

  const h1 = document.createElement('h1');
  h1.className = 'text-2xl font-bold mb-6 text-center';
  h1.textContent = 'MCP SSH Config';
  card.appendChild(h1);

  const input = document.createElement('input');
  input.type = 'password';
  input.id = 'token-input';
  input.placeholder = 'API Token';
  input.className = 'w-full px-3 py-2 border rounded mb-4';
  card.appendChild(input);

  const btn = document.createElement('button');
  btn.id = 'connect-btn';
  btn.className = 'w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700';
  btn.textContent = 'Connect';
  card.appendChild(btn);

  const error = document.createElement('p');
  error.id = 'login-error';
  error.className = 'text-red-600 mt-2 hidden';
  card.appendChild(error);

  wrapper.appendChild(card);
  main.appendChild(wrapper);

  // Focus input
  input.focus();

  async function doLogin() {
    const token = input.value.trim();
    if (!token) {
      error.textContent = 'Please enter a token';
      error.classList.remove('hidden');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Connecting...';
    error.classList.add('hidden');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      if (res.ok) {
        window.location.hash = '#/targets';
      } else {
        error.textContent = 'Invalid token';
        error.classList.remove('hidden');
      }
    } catch (e) {
      error.textContent = 'Connection failed';
      error.classList.remove('hidden');
    }
    btn.disabled = false;
    btn.textContent = 'Connect';
  }

  btn.addEventListener('click', doLogin);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
}

// ===========================================================================
// Page: SSH Targets
// ===========================================================================

async function renderTargets() {
  const main = document.getElementById('main-content');
  showLoading(main);

  try {
    const res = await api('GET', '/config');
    if (!res.ok) throw new Error('Failed to load config');
    const config = await res.json();
    const targets = config.ssh_targets || {};

    main.innerHTML = '';

    // Container
    const container = document.createElement('div');
    container.className = 'container mx-auto px-4 py-6';

    // Header row
    const header = document.createElement('div');
    header.className = 'flex items-center justify-between mb-4';
    const title = document.createElement('h1');
    title.className = 'text-2xl font-bold text-gray-800';
    title.textContent = 'SSH Targets';
    const addBtn = document.createElement('button');
    addBtn.className = 'bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm';
    addBtn.textContent = 'Add Target';
    header.appendChild(title);
    header.appendChild(addBtn);
    container.appendChild(header);

    // Table wrapper
    const tableWrap = document.createElement('div');
    tableWrap.className = 'overflow-x-auto';
    const table = document.createElement('table');
    table.className = 'min-w-full bg-white rounded-lg shadow';

    // Thead
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    headRow.className = 'bg-gray-50 text-left text-sm text-gray-600';
    ['Name', 'Host', 'Port', 'Username', 'Actions'].forEach((h) => {
      const th = document.createElement('th');
      th.className = 'px-4 py-3 font-medium';
      th.textContent = h;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    // Tbody
    const tbody = document.createElement('tbody');
    tbody.className = 'divide-y divide-gray-200';

    const names = Object.keys(targets).sort();
    if (names.length === 0) {
      const emptyRow = document.createElement('tr');
      const emptyCell = document.createElement('td');
      emptyCell.colSpan = 5;
      emptyCell.className = 'px-4 py-8 text-center text-gray-500';
      emptyCell.textContent = 'No SSH targets configured. Click "Add Target" to create one.';
      emptyRow.appendChild(emptyCell);
      tbody.appendChild(emptyRow);
    }

    names.forEach((name) => {
      const target = targets[name];
      const row = document.createElement('tr');
      row.className = 'hover:bg-gray-50';

      const nameCell = document.createElement('td');
      nameCell.className = 'px-4 py-3 font-medium text-gray-900';
      nameCell.textContent = name;
      row.appendChild(nameCell);

      const hostCell = document.createElement('td');
      hostCell.className = 'px-4 py-3 text-gray-700';
      hostCell.textContent = target.host || '';
      row.appendChild(hostCell);

      const portCell = document.createElement('td');
      portCell.className = 'px-4 py-3 text-gray-700';
      portCell.textContent = String(target.port || 22);
      row.appendChild(portCell);

      const userCell = document.createElement('td');
      userCell.className = 'px-4 py-3 text-gray-700';
      userCell.textContent = target.username || '';
      row.appendChild(userCell);

      const actionsCell = document.createElement('td');
      actionsCell.className = 'px-4 py-3';

      const checkBtn = document.createElement('button');
      checkBtn.className = 'text-green-600 hover:text-green-800 text-sm mr-3';
      checkBtn.textContent = 'Check';

      const editBtn = document.createElement('button');
      editBtn.className = 'text-blue-600 hover:text-blue-800 text-sm mr-3';
      editBtn.textContent = 'Edit';

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'text-red-600 hover:text-red-800 text-sm';
      deleteBtn.textContent = 'Delete';

      actionsCell.appendChild(checkBtn);
      actionsCell.appendChild(editBtn);
      actionsCell.appendChild(deleteBtn);
      row.appendChild(actionsCell);

      // Edit handler
      editBtn.addEventListener('click', () => {
        const div = el('div', 'space-y-4');
        const nameInput = el('input', 'w-full px-3 py-2 border rounded text-sm');
        nameInput.type = 'text';
        nameInput.id = 'm-name';
        nameInput.disabled = true;
        const portInput = el('input', 'w-full px-3 py-2 border rounded text-sm');
        portInput.type = 'number';
        portInput.id = 'm-port';
        portInput.value = target.port || 22;
        const privateKeyTA = el('textarea', 'w-full px-3 py-2 border rounded text-sm');
        privateKeyTA.id = 'm-private-key';
        privateKeyTA.rows = 3;
        privateKeyTA.placeholder = 'Leave empty to keep unchanged';
        const checkCmdInput = el('input', 'w-full px-3 py-2 border rounded text-sm');
        checkCmdInput.type = 'text';
        checkCmdInput.id = 'm-checkcommand';
        checkCmdInput.placeholder = 'echo ping';
        div.appendChild(makeFormGroup('Name', { id: 'm-name' }));
        div.children[0].querySelector('input').replaceWith(nameInput);
        div.appendChild(makeFormGroup('Host', { id: 'm-host' }));
        div.appendChild(makeFormGroup('Port', { id: 'm-port', type: 'number' }));
        div.children[2].querySelector('input').replaceWith(portInput);
        div.appendChild(makeFormGroup('Username', { id: 'm-username' }));
        div.appendChild(makeFormGroup('Password', { id: 'm-password', type: 'password', placeholder: 'Leave empty to keep unchanged' }));
        div.appendChild(makeFormGroup('Private Key', { id: 'm-private-key', type: 'textarea', rows: 3, placeholder: 'Leave empty to keep unchanged' }));
        div.children[5].querySelector('textarea').replaceWith(privateKeyTA);
        div.appendChild(makeFormGroup('Check Command', { id: 'm-checkcommand', placeholder: 'echo ping' }));
        div.children[6].querySelector('input').replaceWith(checkCmdInput);
        showModal(
          'Edit Target',
          () => div,
          async (body) => {
          const host = body.querySelector('#m-host').value.trim();
          const port = parseInt(body.querySelector('#m-port').value, 10) || 22;
          const username = body.querySelector('#m-username').value.trim();
          const password = body.querySelector('#m-password').value;
          const privateKey = body.querySelector('#m-private-key').value;
          const checkcommand = body.querySelector('#m-checkcommand').value.trim();
          if (!host) throw new Error('Host is required');
          if (!username) throw new Error('Username is required');
          const payload = { host, port, username };
          if (password) payload.password = password;
          if (privateKey) payload.private_key = privateKey;
          if (checkcommand) payload.checkcommand = checkcommand;
          const r = await api('PUT', `/config/ssh_targets/${encodeURIComponent(name)}`, payload);
          if (!r.ok) {
            const err = await r.json();
            throw new Error(err.message || 'Failed to save target');
          }
          showToast('Target updated');
          renderTargets();
        },
          (body) => {
            body.querySelector('#m-name').value = name;
            body.querySelector('#m-host').value = target.host || '';
            body.querySelector('#m-username').value = target.username || '';
            body.querySelector('#m-checkcommand').value = target.checkcommand || '';
          }
        );
      });

      // Delete handler
      deleteBtn.addEventListener('click', async () => {
        const ok = await confirm(`Delete target "${name}"?`);
        if (!ok) return;
        const r = await api('DELETE', `/config/ssh_targets/${encodeURIComponent(name)}`);
        if (!r.ok) {
          const err = await r.json();
          showToast(err.message || 'Failed to delete', 'error');
          return;
        }
        showToast('Target deleted');
        renderTargets();
      });

      // Check handler
      checkBtn.addEventListener('click', async () => {
        checkBtn.disabled = true;
        checkBtn.textContent = 'Checking...';
        try {
          const r = await api('POST', `/config/ssh_targets/${encodeURIComponent(name)}/check`);
          const result = await r.json();
          if (result.success) {
            showToast(`Connection OK: ${result.output || 'success'}`, 'success');
          } else {
            showToast(`Connection FAILED: ${result.error || result.output || 'unknown error'}`, 'error');
          }
        } catch (err) {
          showToast(`Check failed: ${err.message}`, 'error');
        } finally {
          checkBtn.disabled = false;
          checkBtn.textContent = 'Check';
        }
      });

      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    tableWrap.appendChild(table);
    container.appendChild(tableWrap);
    main.appendChild(container);

    // Add Target handler
    addBtn.addEventListener('click', () => {
      showModal('Add Target', () => {
        const div = el('div', 'space-y-4');
        div.appendChild(makeFormGroup('Name', { id: 'm-name', placeholder: 'e.g. my-server' }));
        div.appendChild(makeFormGroup('Host', { id: 'm-host', placeholder: 'e.g. 192.168.1.10' }));
        div.appendChild(makeFormGroup('Port', { id: 'm-port', type: 'number', value: '22' }));
        div.appendChild(makeFormGroup('Username', { id: 'm-username', placeholder: 'e.g. root' }));
        div.appendChild(makeFormGroup('Password', { id: 'm-password', type: 'password' }));
        div.appendChild(makeFormGroup('Private Key', { id: 'm-private-key', type: 'textarea', rows: 3 }));
        div.appendChild(makeFormGroup('Check Command', { id: 'm-checkcommand', placeholder: 'echo ping' }));
        return div;
      }, async (body) => {
        const targetName = body.querySelector('#m-name').value.trim();
        const host = body.querySelector('#m-host').value.trim();
        const port = parseInt(body.querySelector('#m-port').value, 10) || 22;
        const username = body.querySelector('#m-username').value.trim();
        const password = body.querySelector('#m-password').value;
        const privateKey = body.querySelector('#m-private-key').value;
        const checkcommand = body.querySelector('#m-checkcommand').value.trim();
        if (!targetName) throw new Error('Name is required');
        if (!/^[a-zA-Z0-9._-]+$/.test(targetName)) throw new Error('Name must match [a-zA-Z0-9._-]+');
        if (!host) throw new Error('Host is required');
        if (!username) throw new Error('Username is required');
        const payload = { host, port, username };
        if (password) payload.password = password;
        if (privateKey) payload.private_key = privateKey;
        if (checkcommand) payload.checkcommand = checkcommand;
        const r = await api('PUT', `/config/ssh_targets/${encodeURIComponent(targetName)}`, payload);
        if (!r.ok) {
          const err = await r.json();
          throw new Error(err.message || 'Failed to save target');
        }
        showToast('Target created');
        renderTargets();
      });
    });

  } catch (err) {
    main.innerHTML = `<div class="p-6 text-red-600">Error: ${escapeHtml(err.message)}</div>`;
  }
}

// ===========================================================================
// Page: Block Patterns
// ===========================================================================

async function renderPatterns() {
  const main = document.getElementById('main-content');
  showLoading(main);

  try {
    const res = await api('GET', '/config');
    if (!res.ok) throw new Error('Failed to load config');
    const config = await res.json();
    const patterns = config.block_patterns || [];

    main.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'container mx-auto px-4 py-6';

    // Header
    const header = document.createElement('div');
    header.className = 'flex items-center justify-between mb-4';
    const title = document.createElement('h1');
    title.className = 'text-2xl font-bold text-gray-800';
    title.textContent = 'Block Patterns';

let _rulesActiveTab = 'default';

async function renderRules() {
  const main = document.getElementById('main-content');
  showLoading(main);

  try {
    const res = await api('GET', '/config');
    if (!res.ok) throw new Error('Failed to load config');
    const config = await res.json();
    const ac = config.allowed_commands || {};
    const defaultRules = ac.default || [];
    const apiKeys = ac.api_keys || [];
    const networks = ac.networks || [];

    main.innerHTML = '';

    const container = document.createElement('div');
    container.className = 'container mx-auto px-4 py-6';

    // Title
    const title = document.createElement('h1');
    title.className = 'text-2xl font-bold text-gray-800 mb-4';
    title.textContent = 'Command Rules';
    container.appendChild(title);

    // Tabs
    const tabs = document.createElement('div');
    tabs.className = 'flex border-b mb-4';
    ['default', 'api_keys', 'networks'].forEach((tab) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn px-4 py-2 text-sm text-gray-600 mr-2';
      btn.dataset.tab = tab;
      btn.textContent = tab === 'default' ? 'Default Rules' : tab === 'api_keys' ? 'API Key Rules' : 'Network Rules';
      if (tab === _rulesActiveTab) btn.classList.add('active');
      btn.addEventListener('click', () => {
        _rulesActiveTab = tab;
        renderRules();
      });
      tabs.appendChild(btn);
    });
    container.appendChild(tabs);

    // Content area
    const content = document.createElement('div');
    container.appendChild(content);
    main.appendChild(container);

    if (_rulesActiveTab === 'default') {
      renderDefaultRules(content, defaultRules);
    } else if (_rulesActiveTab === 'api_keys') {
      renderApiKeyRules(content, apiKeys, defaultRules);
    } else {
      renderNetworkRules(content, networks, Object.keys(config.ssh_targets || {}));
    }

  } catch (err) {
    main.innerHTML = `<div class="p-6 text-red-600">Error: ${escapeHtml(err.message)}</div>`;
  }
}

// ===========================================================================
// Rule-Group Rows (shared by API Key Rules and Network Rules)
// ===========================================================================

/**
 * Append one table row per rule entry to a rules table body.
 *
 * Cells that must appear once per group (e.g. Name, Range, Actions) are built
 * by the caller and passed as `leading` (before the Targets/Commands columns)
 * and `trailing` (after them). They anchor the group's first row with rowspan
 * so they span every entry's row and stay usable for any group size. Every row
 * of the group shares whole-group hover highlighting, and only the group's
 * first row carries the divider border, so a group reads as a single block.
 *
 * @param {HTMLTableSectionElement} tbody - table body to append rows to
 * @param {Object} spec - rendering specification
 * @param {HTMLElement[]} [spec.leading] - span cells before Targets/Commands
 * @param {HTMLElement[]} [spec.trailing] - span cells after Targets/Commands
 * @param {Array<Object>} [spec.entries] - rule entries in config order; when
 *   empty, a single muted placeholder row is rendered instead
 * @param {number} spec.placeholderColspan - colspan of the placeholder cell
 *   covering the Targets/Commands columns
 * @param {boolean} [spec.showSudo] - when true, sudo-allowed commands in a
 *   Commands cell render bold (Network Rules); other tabs stay plain text
 * @param {Function} [spec.onCommandsCell] - optional hook invoked as
 *   (cell, entry, index) for every Commands cell so a caller can make it
 *   interactive; when absent the cell stays plain text (API Key Rules)
 * @param {Function} [spec.onTargetsCell] - optional hook invoked as
 *   (cell, entry, index) for every Targets cell, used by Network Rules to open
 *   the targets modal
 */
function appendRuleGroupRows(tbody, spec) {
  const leading = spec.leading || [];
  const trailing = spec.trailing || [];
  const entries = Array.isArray(spec.entries) ? spec.entries : [];
  const rowSpan = Math.max(entries.length, 1);
  const rows = [];

  leading.concat(trailing).forEach((cell) => {
    cell.rowSpan = rowSpan;
    cell.classList.add('align-top');
  });

  if (entries.length === 0) {
    const row = document.createElement('tr');
    leading.forEach((cell) => row.appendChild(cell));
    const placeholderCell = document.createElement('td');
    placeholderCell.colSpan = spec.placeholderColspan;
    placeholderCell.className = 'px-4 py-3 text-sm text-gray-500';
    placeholderCell.textContent = 'No target configurations';
    row.appendChild(placeholderCell);
    trailing.forEach((cell) => row.appendChild(cell));
    rows.push(row);
  } else {
    entries.forEach((entry, i) => {
      const rule = entry || {};
      const row = document.createElement('tr');
      if (i === 0) leading.forEach((cell) => row.appendChild(cell));

      const targetsCell = document.createElement('td');
      targetsCell.className = 'px-4 py-3 text-sm';
      renderTargetsCell(targetsCell, rule.targets);
      if (typeof spec.onTargetsCell === 'function') spec.onTargetsCell(targetsCell, entry, i);
      row.appendChild(targetsCell);

      const cmdsCell = document.createElement('td');
      cmdsCell.className = 'px-4 py-3 text-sm font-mono';
      renderCommandsCell(
        cmdsCell,
        rule.commands,
        spec.showSudo ? rule.sudo_allowed : []
      );
      if (typeof spec.onCommandsCell === 'function') spec.onCommandsCell(cmdsCell, entry, i);
      row.appendChild(cmdsCell);

      if (i === 0) trailing.forEach((cell) => row.appendChild(cell));
      rows.push(row);
    });
  }

  // Exactly one divider above each group except the very first row of the
  // table; rows within a group share a single highlight class so hovering any
  // row of a rule highlights every row of that rule.
  const needsDivider = tbody.children.length > 0;
  rows.forEach((row, i) => {
    if (i === 0 && needsDivider) row.classList.add('rule-group-start');
    row.addEventListener('mouseenter', () => rows.forEach((r) => r.classList.add('rule-group-hover')));
    row.addEventListener('mouseleave', () => rows.forEach((r) => r.classList.remove('rule-group-hover')));
    tbody.appendChild(row);
  });
}
