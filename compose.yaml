services:
  mcp-ssh:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/gelse/ssh-mcp:latest
    container_name: mcp-ssh
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./ssh_key:/app/ssh_key:ro
      - ./ssh_key.pub:/app/ssh_key.pub:ro
    environment:
      - CONFIG_DIR=/config
      - LOG_DIR=/logs
    ports:
      - "9080:8080"

  mcp-ssh-config-api:
    build:
      context: .
      dockerfile: Dockerfile.config-api
    image: ghcr.io/gelse/ssh-mcp-config-api:latest
    container_name: mcp-ssh-config-api
    restart: unless-stopped
    environment:
      - CONFIG_API_TOKEN=${CONFIG_API_TOKEN}
      - CONFIG_DIR=/config
      - CONFIG_API_PORT=8081
      - CONFIG_API_HOST=0.0.0.0
      - MCP_SERVER_URL=http://mcp-ssh:8080/mcp
    volumes:
      - ./config:/config:rw
    ports:
      - "9081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
