services:
  mcp-ssh:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/gelse/ssh-mcp:latest
    container_name: mcp-ssh
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./ssh_key:/app/ssh_key:ro
      - ./ssh_key.pub:/app/ssh_key.pub:ro
    environment:
      - CONFIG_DIR=/config
      - LOG_DIR=/logs
      - CONFIG_API_ENABLED=${CONFIG_API_ENABLED:-false}
      - CONFIG_API_TOKEN=${CONFIG_API_TOKEN:-}
      - CONFIG_API_PORT=8081
    ports:
      - "9080:8080"
      - "9081:8081"  # Config API (only active when CONFIG_API_ENABLED=true)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
